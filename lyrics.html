<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const LIC_TEXT = { zh:'代码 MIT · 元数据 CC BY 4.0 · 素材依各来源许可',
                  en:'Code MIT · metadata CC BY 4.0 · material per source' };
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
let LANG = store.get('midicn-lang', null) || 'zh';
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const $ = id => document.getElementById(id);
const fmt = n => (n||0).toLocaleString('en-US');

/* ── 分片读取（境内韧性：失败重试一次）───────────────────────────── */
async function fetchJSON(url){
  for(let i=0;i<2;i++){
    try{ const r = await fetch(url, {cache:'force-cache'});
         if(r.ok) return await r.json(); }catch(e){}
  }
  throw new Error('load failed: ' + url);
}

let INDEX = [], SHARD = {}, shown = 0, hits = [];
const PAGE = 60;

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  document.querySelectorAll('[data-ph-zh]').forEach(el=>{
    const v = el.getAttribute('data-ph-' + LANG); if (v != null) el.placeholder = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh';
  store.set('midicn-lang', LANG); applyLang(); };


function rowHTML(it){
  const [id, title, reg, chars, shard] = it;
  return '<div class="panel" data-id="'+id+'" data-shard="'+shard+'" style="margin-bottom:var(--s3)">'+
    '<div class="panel-hd" style="cursor:pointer">'+
      '<b style="font-size:var(--fs-15)">'+(title || id)+'</b>'+
      (reg ? '<span class="meta">'+reg+'</span>' : '')+
      '<span style="margin-left:auto"></span>'+
      '<span class="meta">'+fmt(chars)+' 字</span>'+
      '<button class="iconbtn" data-act="toggle" style="margin-left:var(--s2)">▾</button>'+
    '</div>'+
    '<div class="panel-bd" hidden></div>'+
  '</div>';
}

function render(){
  $('lede').innerHTML = t(
    '中国民间歌曲集成（OMR）的 <b>10,035 首</b>民歌歌词，可按<b>曲名</b>或<b>歌词全文</b>检索。歌词随 MIDI 一同来自上游数据集，<b>本页仅供检索</b>。',

  );
  $('hint').innerHTML = t(
    '按曲名即时过滤；输入 2 个以上字符时同时检索歌词全文（首次全文检索需载入分片，约 5 MB）。',

  $('about').innerHTML = t(
    '<p><b>来源</b>：中国民间歌曲集成（OMR 数据集，m-july）· 逐曲旋律与记谱源自各省卷的整理稿。</p>'+

function doFilter(){
  const q = ($('q').value || '').trim().toLowerCase();
  const reg = $('reg').value;
  hits = INDEX.filter(it=>{
    if(reg && it[2] !== reg) return false;
    if(!q) return true;
    return (it[1] || '').toLowerCase().includes(q);
  });
  $('cnt').textContent = t(fmt(hits.length) + ' 首', fmt(hits.length) + ' tracks');
  shown = 0;
  $('list').innerHTML = '';
  paint();

  // 2 字以上且曲名未命中足够时，异步补全文检索
  if(q.length >= 2){
    const seen = new Set(hits.map(x=>x[0]));
    fullTextSearch(q, reg, seen).catch(()=>{});
  }
}

let token = 0;
async function fullTextSearch(q, reg, seen){
  const my = ++token;
  const nShard = Math.max(...INDEX.map(x=>x[4])) + 1;
  for(let si=0; si<nShard; si++){
    if(my !== token) return;                       // 用户已改查询，放弃本轮
    let b = SHARD[si];
    if(!b){ try{ b = await fetchJSON('data/lyrics/s'+String(si).padStart(2,'0')+'.json'); }
            catch(e){ continue; }
            SHARD[si] = b; }
    let added = 0;
    for(const id in b){
      if(seen.has(id)) continue;
      if(!b[id].toLowerCase().includes(q)) continue;
      const it = INDEX.find(x=>x[0]===id);         // 命中后再取元数据
      if(!it || (reg && it[2] !== reg)) continue;
      seen.add(id); hits.push(it); added++;
    }
    if(added){ $('cnt').textContent = t(fmt(hits.length)+' 首', fmt(hits.length)+' tracks'); paint(); }
  }
}

function paint(){
  const slice = hits.slice(shown, shown + PAGE);
  if(!slice.length) return;
  $('list').insertAdjacentHTML('beforeend', slice.map(rowHTML).join(''));
  shown += slice.length;
  const left = hits.length - shown;
  $('more').hidden = left <= 0;
  $('more').textContent = left > 0 ? t('显示更多（还有 ' + fmt(left) + ' 首）', 'Show more (' + fmt(left) + ' left)') : '';
}

$('more').onclick = paint;
$('q').oninput = ()=>{ token++; doFilter(); };
$('reg').onchange = ()=>{ token++; load(); };

$('list').addEventListener('click', async e=>{
  const hd = e.target.closest('.panel-hd'); if(!hd) return;
  const card = hd.parentElement;
  const bd = card.querySelector('.panel-bd');
  const id = card.dataset.id, si = +card.dataset.shard;
  if(!bd.hidden){ bd.hidden = true; return; }
  if(!bd.dataset.loaded){
    bd.innerHTML = '<p class="meta">…</p>';
    try{
      let b = SHARD[si];
      if(!b){ b = await fetchJSON('data/lyrics/s'+String(si).padStart(2,'0')+'.json'); SHARD[si] = b; }
      const txt = b[id] || t('（无歌词）','(no lyrics)');
      bd.innerHTML = '<p style="white-space:pre-wrap;line-height:1.9;font-size:var(--fs-15)">'+
                     txt.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>'+
                     '<p class="meta" style="margin-top:var(--s3)">'+id+' · '+t('仅限研究/学习','study use only')+'</p>';
    }catch(err){ bd.innerHTML = '<p class="meta">'+t('加载失败','Load failed')+'</p>'; }
    bd.dataset.loaded = '1';
  }
  bd.hidden = false;
});

async function load(){
  try{
    INDEX = await fetchJSON('data/lyrics/index.json');
  }catch(e){
    $('notice').innerHTML = t('歌词索引加载失败，请刷新重试。','Failed to load the lyrics index; please refresh.');
    return;
  }
  const regs = {};
  INDEX.forEach(it=>{ if(it[2]) regs[it[2]] = (regs[it[2]]||0)+1; });
  const sel = $('reg');
  sel.innerHTML = '<option value="">'+t('全部地区','All regions')+'</option>' +
    Object.keys(regs).sort().map(r=>'<option value="'+r+'">'+r+' ('+regs[r]+')</option>').join('');
  doFilter();
}

applyLang();
load();
</script>
