<script>
const $ = id => document.getElementById(id);
let LANG = localStorage.getItem('midicn-lang') || 'zh';
if (localStorage.getItem('midicn-theme')) document.documentElement.dataset.theme = localStorage.getItem('midicn-theme');
$('theme').onclick = () => { const c = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = c; localStorage.setItem('midicn-theme', c); };
$('lang').onclick = () => { LANG = LANG==='zh'?'en':'zh'; localStorage.setItem('midicn-lang',LANG);
  $('lang').textContent = LANG==='zh'?'EN':'中'; applyLang(); };
$('lang').textContent = LANG==='zh'?'EN':'中';

const T = {
  zh:{ composer:'作曲家', period:'时期', genre:'类型', region:'地域', inst:'编制', cat:'分类', workno:'作品编号', form:'曲式', year:'年代', country:'国家', diff:'难度',
       license:'许可与调用', data:'数据', listen:'试听', rel:'相似与相邻',
       ok:'C1 可商用', mid:'C2 非商用', no:'C3 研究/学习', use1:'需按来源署名（文本如下，可一键复制）',
       use2:'仅限个人欣赏 / 教育 / 非商业项目，禁止商业使用', use3:'仅限研究 / 教学 / 学习，禁止商业使用与公开表演',
       use3b:'仅限研究 / 教学 / 学习用途，不得用于产品或公开表演',
       dur:'时长', notes:'音符数', fsize:'文件大小', file:'库内路径', dl:'下载 MIDI',
       copy:'复制署名', copied:'已复制 ✓', libopen:'在音乐库中打开', prev:'上一曲', next:'下一曲',
       samec:'同作曲家更多作品', none:'（暂无可推荐）', playing:'播放中', sf:'采样音源', synth:'合成音源',
       load:'加载', failed:'播放失败：', sfl:'音源加载中', nf:'未找到该曲目（ID 或参数有误）' },
  en:{ composer:'Composer', period:'Period', genre:'Genre', region:'Region', inst:'Scoring', cat:'Category', workno:'Work No.', form:'Form', year:'Year', country:'Country', diff:'Difficulty',
       license:'License & Usage', data:'Data', listen:'Listen', rel:'Related',
       ok:'C1 Commercial', mid:'C2 Non-comm.', no:'C3 Study', use1:'Attribution required (text below, one-click copy)',
       use2:'Personal / educational / non-commercial use only', use3:'Research / teaching / study only; no commercial use or public performance',
       use3b:'Research / teaching / study only; not for products or public performance',
       dur:'Duration', notes:'Notes', fsize:'File size', file:'Path', dl:'Download MIDI',
       copy:'Copy attribution', copied:'Copied ✓', libopen:'Open in library', prev:'Prev', next:'Next',
       samec:'More by this composer', none:'(none)', playing:'Playing', sf:'SoundFont', synth:'Synth',
       load:'Loading', failed:'Playback failed: ', sfl:'Loading soundfont', nf:'Track not found (bad id or params)' }
};
const t = k => T[LANG][k] || k;
function applyLang(){ document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-zh]').forEach(el => el.textContent = LANG==='zh' ? el.dataset.zh : el.dataset.en);
  if(window.__track) render(window.__track, window.__ctx); }
$('lang').textContent = LANG==='zh'?'EN':'中';

/* 来源 → 归属与附加义务 */
const SRC = {
  aria:{n:'ariamidi',l:'CC BY-NC-SA 4.0'}, thesession:{n:'TheSession.org',l:'CC BY-SA 4.0'},
  essen:{n:'Essen (EsAC)',l:'站点开放声明'}, lakh:{n:'Lakh MIDI',l:'CC BY 4.0'},
  norbeck:{n:'Norbeck Abby',l:'站点开放声明'}, m21:{n:'music21 corpus',l:'公有领域'},
  mutopia:{n:'Mutopia Project',l:'逐曲 PD / CC'}, abcmisc:{n:'ABCMisc',l:'站点开放声明'},
  openscore:{n:'OpenScore Lieder',l:'CC0-1.0'}, maestro:{n:'MAESTRO',l:'CC BY-NC-SA 4.0'},
  groove:{n:'Groove MIDI Dataset',l:'CC BY 4.0'}, emopia:{n:'EMOPIA',l:'CC BY-NC-SA 4.0'},
  nottingham:{n:'Nottingham',l:'站点开放声明'}, wikifonia:{n:'Wikifonia（PD 子集）',l:'公有领域'},
  oga:{n:'OpenGameArt',l:'CC0 / CC BY / CC BY-SA / GPL（逐曲）'}, musicnet:{n:'MusicNet',l:'CC BY 4.0'},
  chinafolk:{n:'中国民间歌曲集成（OMR 数据集）',l:'TRADITIONAL-STUDY'},
  giantmidi:{n:'GiantMIDI-Piano（ByteDance）',l:'CC BY 4.0'},
  cyberhymnal:{n:'The Cyber Hymnal™（hymntime.com/tch）',l:'Public Domain'}
};
const DIFF = {
  zh:{beginner:'初级', intermediate:'中级', advanced:'进阶', virtuoso:'演奏级'},
  en:{beginner:'Beginner', intermediate:'Intermediate', advanced:'Advanced', virtuoso:'Virtuoso'}
};
const PERIOD = {renaissance:['文艺复兴','Renaissance'],baroque:['巴洛克','Baroque'],classical:['古典','Classical'],
  romantic:['浪漫','Romantic'],modern:['现代','Modern'],contemporary:['当代','Contemporary'],traditional:['传统','Traditional']};

/* ── 音频（与 index.html 同引擎；defer 脚本在后台加载，点击播放前必已就绪） ── */
function fetchT(url, opt){
  opt=opt||{}; const tries=opt.tries||3, to=opt.timeout||20000;
  return (async function(){
    let last=null;
    for(let a=0;a<tries;a++){
      const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),to);
      try{
        const r=await fetch(url,Object.assign({},opt,{signal:ac.signal}));
        clearTimeout(tm);
        if(!r.ok&&r.status>=500&&a<tries-1){ await new Promise(z=>setTimeout(z,700*(a+1))); continue; }
        return r;
      }catch(e){ clearTimeout(tm); last=e;
        if(a<tries-1) await new Promise(z=>setTimeout(z,700*(a+1))); }
    }
    throw last||new Error('fetch failed');
  })();
}
async function fetchBuf(url,onPct){
  const r=await fetchT(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const len=+r.headers.get('Content-Length')||0;
  if(!r.body||!len) return await r.arrayBuffer();
  const rd=r.body.getReader(); const chunks=[]; let got=0;
  for(;;){ const st=await rd.read(); if(st.done) break;
    chunks.push(st.value); got+=st.value.length;
    if(onPct) onPct(Math.min(99,Math.round(got/len*100))); }
  if(onPct) onPct(100);
  const out=new Uint8Array(got); let o=0;
  for(const c of chunks){ out.set(c,o); o+=c.length; }
  return out.buffer;
}
let ready=false,syn=null,bass=null,perc=null,part=null,sfSynth=null,sfReady=false,sfLoading=false,sfFailed=false;
let playing=false,uiTimer=null,curTotal=1,t0=0;
async function waitEngine(){
  let n=0; while(typeof Tone==='undefined' && n<100){ await new Promise(z=>setTimeout(z,100)); n++; }
  if(typeof Tone==='undefined') throw new Error('audio engine not ready');
}
const volDb = () => -36 + ($('vol').value/100)*36;
function initAudio(){
  if(ready) return;
  const verb = new Tone.Reverb({decay:3.0,preDelay:.015,wet:.26}).connect(Tone.Destination);
  const filt = new Tone.Filter({type:'lowpass',frequency:5200,rolloff:-12}).connect(verb);
  const comp = new Tone.Compressor({threshold:-20,ratio:2.6,attack:.01,release:.25}).connect(filt);
  syn = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'amtriangle',harmonicity:2.02,modulationType:'sine'},
    envelope:{attack:.004,decay:1.35,sustain:.1,release:2.0},volume:-9}).connect(comp);
  bass = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'sine'},
    envelope:{attack:.012,decay:1.1,sustain:.16,release:1.6},volume:-11}).connect(comp);
  perc = new Tone.PolySynth(Tone.MembraneSynth,{volume:-6}).connect(comp);
  Tone.Destination.volume.value = volDb(); ready=true;
}
$('vol').oninput = () => { if(ready) Tone.Destination.volume.value = volDb(); };
function setBadge(txt,cls){ const el=$('sfbadge'); el.textContent=txt; el.className='pill '+(cls||''); }
async function ensureSoundFont(){
  if(sfReady||sfLoading) return;
  sfLoading=true; setBadge(t('sfl'));
  try{
    const AC = Tone.getContext().rawContext;
    sfSynth = new JSSynth.AudioWorkletNodeSynthesizer();
    await sfSynth.init(AC);
    let ab=null;
    if('DecompressionStream' in window){
      try{ ab=await fetchBuf('soundfont/GeneralUser-GS.sf2.gz', p=>setBadge(t('sfl')+' '+p+'%')); }catch(e){}
    }
    if(!ab) ab=await fetchBuf('soundfont/GeneralUser-GS.sf2', p=>setBadge(t('sfl')+' '+p+'%'));
    await sfSynth.loadSFont(ab);
    sfReady=true; setBadge(t('sf'),'sf');
  }catch(e){ sfFailed=true; setBadge(t('synth'),'nc'); }
  sfLoading=false;
}
const fmt = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function stop(){
  clearInterval(uiTimer);
  if(sfSynth){ try{sfSynth.stop();}catch(e){} }
  if(part){ try{part.stop();part.dispose();}catch(e){} part=null; }
  try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
  if(ready){ syn.releaseAll(); bass.releaseAll(); perc.releaseAll(); }
  playing=false; $('play').innerHTML='▶ <span data-zh="播放" data-en="Play">播放</span>';
  $('prog').value=0;
}
async function playTrack(x){
  stop(); await waitEngine();
  $('np').textContent = t('load')+' '+(x.t||x.id)+' …';
  $('tag').textContent = x.z==='main'?'C1':(x.z==='study'?'C3':'C2');
  $('tag').className = 'pill ' + (x.z==='main' ? 'st' : (x.z==='study' ? '' : 'nc'));
  curTotal = x.du || 1;
  try{
    await Tone.start();
    const ab = await fetchBuf(x.f, p=>{ $('np').textContent=(x.t||x.id)+' · '+t('load')+' '+p+'%'; });
    if(sfReady){
      sfSynth.stop(); await sfSynth.playNewMIDI(ab);
      playing=true; $('play').innerHTML='⏸'; t0=Date.now();
      $('np').textContent=(x.t||x.id)+(x.cn?' · '+x.cn:'')+' · '+t('playing')+' · '+t('sf');
      uiTimer=setInterval(()=>{ if(!playing) return;
        const pos=(Date.now()-t0)/1000;
        $('prog').value=Math.min(1000,(pos/Math.max(curTotal,.1))*1000);
        if(pos>=curTotal) stop(); },300);
      return;
    }
    await ensureSoundFont();
    if(sfReady){ return playTrack(x); }
    initAudio();
    const midi = new Midi(ab);
    const notes=[];
    midi.tracks.forEach(tr => tr.notes.forEach(n => notes.push({
      time:n.time,name:n.name,dur:Math.max(n.duration,.05),vel:n.velocity,pitch:n.midi })));
    if(!notes.length){ $('np').textContent=T[LANG].nf; return; }
    const isPerc = (x.g==='drum') || /drum|perc/i.test(x.i||'');
    Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.position=0;
    part = new Tone.Part((time,n)=>{
      const v=Math.min(1,Math.max(.15,n.vel||.7));
      if(isPerc) perc.triggerAttackRelease(n.pitch<50?'C1':'G2',.12,time,v*.9);
      else if(n.pitch<48) bass.triggerAttackRelease(n.name,n.dur,time,v*.85);
      else syn.triggerAttackRelease(n.name,n.dur,time,v);
    }, notes);
    part.start(0);
    curTotal=Math.round(midi.duration)||1;
    part.stop(curTotal+1.5); Tone.Transport.start('+0.08');
    playing=true; $('play').innerHTML='⏸';
    $('np').textContent=(x.t||x.id)+(x.cn?' · '+x.cn:'')+' · '+fmt(curTotal);
    uiTimer=setInterval(()=>{ if(!playing) return;
      const pos=Tone.Transport.seconds;
      $('prog').value=Math.min(1000,(pos/Math.max(curTotal,.1))*1000);
      if(pos>=curTotal) stop(); },300);
  }catch(e){ $('np').textContent=t('failed')+(e&&e.message||e); }
}
$('play').onclick = () => { playing ? stop() : playTrack(window.__track); };

/* ── 数据定位与渲染 ── */
let LOC=null, CHUNK=null, CATCHUNK=null;
async function findIn(cat, chunk, id){
  const arr = CHUNK && CATCHUNK===cat+'-'+chunk ? CHUNK
    : (CHUNK = CATCHUNK=cat+'-'+chunk, await (await fetch('data/cat-'+cat+'-'+chunk+'.json')).json());
  const i = arr.findIndex(x => x.id === id);
  return i >= 0 ? {x:arr[i], arr, i, cat, chunk} : null;
}
async function locate(id, cat, chunk){
  if(cat!=null && chunk!=null){ const r = await findIn(cat, +chunk, id); if(r) return r; }
  if(!LOC) LOC = await (await fetch('data/loc.json')).json();
  const e = LOC[id]; if(!e) return null;
  return await findIn(e[0], e[1], id);
}
function zonePill(z,l){
  if(z==='main') return ['dot ok', t('ok')];
  if(z==='piano-special') return ['dot mid', t('mid')];
  if(l==='TRADITIONAL-STUDY') return ['dot mid', t('no')+' · TRADITIONAL-STUDY'];
  return ['dot no', t('no')];
}
function attribution(x){
  const src = SRC[x.id.split('-')[0]] || {n:x.id.split('-')[0], l:x.l};
  const lines = LANG==='zh'
    ? ['本曲收录于 midicn-lib（lib.midicn.com）· 曲目 ID: '+x.id,
       '原始来源：'+src.n+' · 许可：'+(x.l||'—'),
       '使用 midicn-lib 数据时请保留本署名。']
    : ['From midicn-lib (lib.midicn.com) · Track ID: '+x.id,
       'Source: '+src.n+' · License: '+(x.l||'—'),
       'Please keep this attribution when using midicn-lib data.'];
  if(x.l==='TRADITIONAL-STUDY') lines.push(LANG==='zh'
    ? '附加义务：限研究 / 教学 / 学习用途；禁止商业使用与公开表演；底本为《中国民间歌曲集成》（受版权保护的汇编作品）。'
    : 'Additional: research / teaching / study only; no commercial use or public performance; source book is a copyrighted compilation.');
  if(src.n.indexOf('Cyber Hymnal')>=0) lines.push(LANG==='zh'
    ? '来源要求：署名 The Cyber Hymnal™（hymntime.com/tch）。'
    : 'Source requirement: credit The Cyber Hymnal™ (hymntime.com/tch).');
  if((x.l||'').indexOf('NC')>=0) lines.push(LANG==='zh'
    ? '附加义务：该来源许可为非商用（NC）。'
    : 'Additional: the source license is Non-Commercial (NC).');
  return lines.join('\n');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function render(x, ctx){
  window.__track = x; window.__ctx = ctx;
  const src = SRC[x.id.split('-')[0]] || {n:'', l:''};
  const pn = PERIOD[x.p] ? PERIOD[x.p][LANG==='zh'?0:1] : (x.p||'—');
  $('ttl').textContent = x.t || x.id;
  $('sub').textContent = (x.cn || 'Traditional') + ' · ' + pn + ' · ' + (src.n || '');
  const cr = $('crumbs');
  cr.innerHTML = '<a href="./">'+(LANG==='zh'?'音乐库':'Library')+'</a> › '
    + '<a href="./?cat='+esc(ctx.cat)+'">'+esc(ctx.cat)+'</a> › <span>'+esc((x.t||x.id).slice(0,42))+'</span>';
  const [dot, label] = zonePill(x.z, x.l);
  const concl = {'ok':'#3B6D11','mid':'#854F0B','no':'#791F1F'}[dot.split(' ')[1]];
  const useText = x.z==='main' ? t('use1') : (x.l==='TRADITIONAL-STUDY' ? t('use3b') : (x.z==='study' ? t('use3') : t('use2')));
  $('box').innerHTML =
    '<div class="card"><h3>'+t('composer')+' / '+t('period')+'</h3><dl class="kv">'
    +'<dt>'+t('composer')+'</dt><dd>'+esc(x.cn||'Traditional')+'</dd>'
    +'<dt>'+t('period')+'</dt><dd>'+esc(pn)+'</dd>'
    +(x.opus?'<dt>'+t('workno')+'</dt><dd>'+esc('Op. '+x.opus+(x.no?' · No. '+x.no:''))+'</dd>':'')
    +(x.form?'<dt>'+t('form')+'</dt><dd>'+esc(x.form)+'</dd>':'')
    +(x.yr?'<dt>'+t('year')+'</dt><dd>'+esc(x.yr)+'</dd>':'')
    +'<dt>'+t('genre')+'</dt><dd>'+esc(x.g||'—')+'</dd>'
    +(x.diff?'<dt>'+t('diff')+'</dt><dd>'+esc(DIFF[LANG][x.diff]||x.diff)+'</dd>':'')
    +(x.ctry?'<dt>'+t('country')+'</dt><dd>'+esc(x.ctry)+'</dd>':'')
    +'<dt>'+t('region')+'</dt><dd>'+esc(x.r||'—')+'</dd>'
    +'<dt>'+t('inst')+'</dt><dd>'+esc(x.i||'—')+'</dd>'
    +'<dt>'+t('cat')+'</dt><dd>'+esc(ctx.cat)+'</dd></dl></div>'
    +'<div class="card"><h3>'+t('license')+'</h3>'
    +'<div class="concl"><span class="'+dot+'"></span><span style="color:'+concl+'">'+label+'</span></div>'
    +'<div class="req">'+useText+'</div>'
    +'<div class="attr" id="attr">'+esc(attribution(x))+'</div>'
    +'<div class="actions"><button class="btn" id="cp">'+t('copy')+'</button></div>'
    +'<p class="req" style="margin-top:.6rem">'+(LANG==='zh'
      ?'权利人如有异议：通过项目 Issues 告知，7 个工作日内响应下架。'
      :'Rights holders: open a project Issue; we remove flagged tracks within 7 business days.')+'</p></div>'
    +'<div class="card"><h3>'+t('data')+'</h3><dl class="kv">'
    +'<dt>'+t('dur')+'</dt><dd>'+(x.du?fmt(x.du):'—')+'</dd>'
    +'<dt>'+t('notes')+'</dt><dd>'+(x.nn?x.nn.toLocaleString():'—')+'</dd>'
    +'<dt>'+t('fsize')+'</dt><dd id="fsz">…</dd>'
    +'<dt>'+t('file')+'</dt><dd>'+esc(x.f)+'</dd></dl>'
    +'<div class="actions"><button class="btn primary" id="dl" style="min-width:120px">'+t('dl')+'</button>'
    +'<span class="pill" id="dlstate" hidden></span></div></div>';
  $('tag').textContent = x.z==='main'?'C1':(x.z==='study'?'C3':'C2');
  $('tag').className = 'pill ' + (x.z==='main' ? 'st' : (x.z==='study' ? '' : 'nc'));
  $('libopen').href = './?play='+encodeURIComponent(x.id)+'&cat='+encodeURIComponent(ctx.cat)+'&chunk='+ctx.chunk;
  $('dl').onclick = () => dlTrack(x);
  $('cp').onclick = async () => {
    const el=document.getElementById('attr'); if(!el) return;
    const txt = el.textContent;
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); }
    $('cp').textContent = t('copied'); setTimeout(()=>{ if(window.__track) $('cp').textContent=t('copy'); },1600);
  };
  /* 文件大小：HEAD + 超时重试 */
  fetchT(x.f, {method:'HEAD'}).then(r=>{ const el=$('fsz');
    if(el && r.ok) el.textContent=(parseInt(r.headers.get('Content-Length')||0)/1024).toFixed(1)+' KB'; }).catch(()=>{});
  /* JSON-LD */
  let ld = document.getElementById('ld'); if(ld) ld.remove();
  ld = document.createElement('script'); ld.id='ld'; ld.type='application/ld+json';
  ld.textContent = JSON.stringify({'@context':'https://schema.org','@type':'MusicComposition',
    name:x.t||x.id, composer:{'@type':'Person',name:x.cn||'Traditional'},
    genre:x.g||'', identifier:x.id, url:location.href.split('?')[0].replace(location.search,'')+'?id='+x.id,
    isAccessibleForFree:true, license:x.l||''});
  document.head.appendChild(ld);
  renderRecs(x, ctx);
}
/* 进度式下载：fetch + 百分比 → blob 保存；失败回落浏览器直链 */
async function dlTrack(x){
  const btn=$('dl'), st=$('dlstate');
  btn.disabled=true;
  try{
    const ab=await fetchBuf(x.f, p=>{ btn.textContent=t('dl')+' '+p+'%'; });
    const blob=new Blob([ab],{type:'audio/midi'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=x.id+'.mid'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    if(st){ st.hidden=false; st.textContent='✓ '+fmt(x.du||0); setTimeout(()=>{st.hidden=true;},2500); }
  }catch(e){
    if(st){ st.hidden=false; st.textContent='✗ '+(e&&e.message||e); setTimeout(()=>{st.hidden=true;},3000); }
    window.open(x.f,'_blank');           /* 回落：浏览器直链下载 */
  }
  btn.textContent=t('dl'); btn.disabled=false;
}
async function renderRecs(x, ctx){
  const box = $('recs'); box.innerHTML='';
  const add = (id, label, sub2, href) => { const a=document.createElement('a'); a.href=href;
    a.innerHTML='<span style="color:var(--tx)">'+esc(label)+'</span><span>'+esc(sub2)+'</span>'; box.appendChild(a); };
  const prev = ctx.arr[ctx.i-1], next = ctx.arr[ctx.i+1];
  const mk = (tid) => 'detail.html?id='+encodeURIComponent(tid)+'&cat='+encodeURIComponent(ctx.cat)+'&chunk='+ctx.chunk;
  if(prev) add(prev.id, prev.t||prev.id, t('prev'), mk(prev.id));
  if(next) add(next.id, next.t||next.id, t('next'), mk(next.id));
  try{
    if(!window.__BYSRC) window.__BYSRC = await (await fetch('meta/index-by-composer.json')).json();
    const ids = (window.__BYSRC[x.c]||[]).filter(tid => tid !== x.id).slice(0, 8);
    if(ids.length){
      const head=document.createElement('div'); head.className='ts'; head.style.cssText='color:var(--dim);margin:.4rem 0 .2rem';
      head.textContent=t('samec'); box.appendChild(head);
      if(!LOC) LOC = await (await fetch('data/loc.json')).json();
      ids.forEach(tid => { const e = LOC[tid]; if(!e) return;
        add(tid, tid, e[0]+' · #'+e[1], 'detail.html?id='+encodeURIComponent(tid)+'&cat='+encodeURIComponent(e[0])+'&chunk='+e[1]); });
    }
  }catch(e){}
  if(!box.children.length) box.innerHTML='<span class="ts" style="color:var(--dim2)">'+t('none')+'</span>';
}
(async function(){
  const q = new URLSearchParams(location.search);
  const id = q.get('id');
  if(!id){ $('ttl').textContent='?'; $('ttl').className='dt err';
    $('sub').textContent='detail.html?id=<trackId>'; return; }
  try{
    const ctx = await locate(id, q.get('cat'), q.get('chunk'));
    if(!ctx){ $('ttl').className='dt err'; $('ttl').textContent='404'; $('sub').textContent=t('nf'); return; }
    render(ctx.x, ctx);
    document.title = (ctx.x.t||ctx.x.id)+' · midicn-lib';
  }catch(e){ $('ttl').className='dt err'; $('ttl').textContent='Error';
    $('sub').textContent=(e&&e.message)||String(e); }
})();
</script>
