<script src="assets/archive.js"></script>
<!-- 音频引擎（Tone + Midi.js + 合成器 + player.js ≈ 415KB）defer 加载：
     不阻塞解析与首屏渲染；引擎慢或失败只影响播放，音乐库照常可用 -->
<script defer src="vendor/Tone.js"></script>
<script defer src="vendor/Midi.js"></script>
<script defer src="soundfont/engine/js-synthesizer.min.js"></script>
<script defer src="assets/player.js"></script>
<script>
/* 兜底：共享模块缺失或异步异常时页面必须给出可见提示（绝不留白页） */
if (typeof fmt === 'undefined') window.fmt = n => (n || 0).toLocaleString('en-US');
addEventListener('unhandledrejection', e => {
  const el = $('status');
  if (el && !el.textContent)
    el.textContent = t('加载出错：','Error: ') + ((e.reason && e.reason.message) || e.reason || '');
});

/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const LIC_TEXT = { zh:'代码 MIT · 元数据 CC BY 4.0 · 素材依各来源许可',
                  en:'Code MIT · metadata CC BY 4.0 · material per source' };
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* 取数重试：弱网/代理抖动时单次失败不应让整页空白 */
async function fetchJSON(url, tries){
  tries = tries || 3;
  let last;
  for (let i = 0; i < tries; i++){
    try{
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }catch(e){
      last = e;
      if (i < tries - 1) await new Promise(res => setTimeout(res, 400 * (i + 1)));
    }
  }
  throw last;
}

let LANG = store.get('midicn-lang', null) || 'zh';
const $ = id => document.getElementById(id);
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const mmss = s => !s ? '—' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

const PERIOD_ZH = { traditional:'传统', renaissance:'文艺复兴', baroque:'巴洛克', classical:'古典',
  romantic:'浪漫', modern:'现代', contemporary:'当代', impressionist:'印象派' };
const INST_ZH = { piano:'钢琴', melody:'旋律乐器', organ:'管风琴', voice:'人声/合唱',
  ensemble:'合奏', voice_piano:'人声与钢琴', drums:'打击乐', guitar:'吉他' };
const GENRE_ZH = { classical:'古典', folk:'民谣', hymn:'赞美诗', drum:'鼓乐', pop:'流行',
  christmas:'圣诞', game:'游戏', jazz:'爵士', atonal:'无调性', ragtime:'拉格泰姆',
  soundtrack:'原声', blues:'布鲁斯', rock:'摇滚' };
const DIFF_ZH = { beginner:'初级', intermediate:'中级', advanced:'进阶', virtuoso:'演奏级' };

let X = null, CAT = null, CHUNK = null, ALL = [], srcMeta = null;

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  if (X) render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh'; store.set('midicn-lang', LANG); applyLang(); };
const themeBtn = $('theme');
function setTheme(v){ document.documentElement.dataset.theme = v; store.set('midicn-theme', v); }
setTheme(store.get('midicn-theme', null) || 'dark');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ── 载入曲目：?id=&cat=&chunk= → 缺失时用 loc.json 兜底 ── */
(async function boot(){
  const p = new URLSearchParams(location.search);
  const id = p.get('id');
  if (!id){ fail(t('缺少 id 参数','Missing id parameter')); return; }
  $('idline').textContent = id;
  let cat = p.get('cat'), chunk = p.get('chunk');
  if (cat == null || chunk == null){
    try{
      const loc = await fetchJSON('data/loc.json');
      const hit = loc[id];
      if (hit){ cat = cat || hit[0]; chunk = chunk == null ? hit[1] : chunk; }
    }catch(e){}
  }
  if (cat == null){ fail(t('未找到该曲目的定位信息','Location not found')); return; }
  let arr;
  try{ arr = await fetchJSON('data/cat-' + cat + '-' + chunk + '.json', 3); }
  catch(e){ fail(t('数据加载失败：','Load failed: ') + e.message); return; }
  ALL = arr;
  X = arr.find(x=>x.id === id);
  if (!X){ fail(t('该分片中未找到此曲目','Track not in this shard')); return; }
  CAT = cat; CHUNK = chunk;
  const prefix = id.split('-')[0];
  srcMeta = SOURCES.find(s=>s.id === prefix) || null;
  render();
})();

/* ═══ 本曲其他演奏版（N1）：data/works.json 跨分片聚合 ═══
   为什么需要它：ATEPP 同一作品的多个录音散布在不同 cat-*-N.json 分片里
   （piano-performance 17,241 首 / 35 片），只靠当前分片看不到全部。
   数据只覆盖 vt=performance 且 ≥2 个录音的作品，按**演奏者**归组——
   同一钢琴家常为同一曲留有多份录音，逐个列出反而噪音大。 */
let WORKS = null, WORKS_P = null;
function loadWorks(){
  if(!WORKS_P) WORKS_P = fetchJSON('data/works.json', 2)
    .then(j=>{ WORKS = j; return j; }).catch(()=>null);
  return WORKS_P;
}
async function renderPerf(x){
  if(!x || x.vt !== 'performance' || !x.wk) return;
  const w = await loadWorks();
  const list = w && w[x.wk];
  if(!list || list.length < 2) return;
  const by = new Map();
  list.forEach(([id, perf])=>{
    if(id === x.id) return;
    const k = perf || t('（未署名演奏者）','(unattributed)');
    if(!by.has(k)) by.set(k, []);
    by.get(k).push(id);
  });
  if(!by.size) return;
  const sorted = [...by.entries()].sort((a,b)=> b[1].length - a[1].length);
  const note = t(
    '同一作品在本库共有 <b>'+sorted.length+'</b> 位演奏者的 <b>'+list.length+'</b> 个录音（含本曲），按演奏者归组：',
    'This library holds <b>'+list.length+'</b> recordings of this work by <b>'+sorted.length+
    '</b> performers (including this one), grouped by performer:');
  $('perfBody').innerHTML = '<p style="margin-bottom:var(--s4)">'+note+'</p>'+
    '<div class="recs">'+sorted.map(([perf, ids])=>
      '<a href="detail.html?id='+encodeURIComponent(ids[0])+'">'+
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(perf)+'</span>'+
        '<span>'+(ids.length>1 ? t('×'+ids.length+' 个录音','×'+ids.length+' rec.') : '1')+'</span></a>'
    ).join('')+'</div>';
  $('perfWrap').hidden = false;
}

function fail(msg){
  document.querySelector('main').innerHTML = '<p class="err">'+esc(msg)+'</p>' +    '<p><a href="./" data-zh="返回音乐库" data-en="Back to library">返回音乐库</a></p>';
  applyLang();
}

function render(){
  const x = X;
  const src = srcMeta;
  const z = src ? zoneOf(src.zone) : ZONES.main;
  const ttl = x.t || x.id;

  document.title = ttl + ' · midicn-lib';
  $('ttl').textContent = ttl;
  const bits = [x.cn, x.opus ? ('Op. ' + x.opus) : null, x.no ? ('No. ' + x.no) : null].filter(Boolean);
  $('sub').innerHTML = esc(bits.join(' · ')) + (x.p ? ' · ' + (LANG==='zh' ? (PERIOD_ZH[x.p]||x.p) : x.p) : '');

  $('crumbs').innerHTML = '<a href="./" data-zh="音乐库" data-en="Library">音乐库</a>' +
    (src ? '<span>/</span><span>'+esc(src.name[LANG])+'</span>' : '') +
    '<span>/</span><span>'+esc(String(CAT))+'</span>';

  /* ① 识别信息 */
  // 作曲家：优先「中文名（原名）」——中文用户先看到 cnzh
  const compName = x.cnzh
    ? esc(x.cnzh) + (x.cn ? ' <span class="meta">'+esc(x.cn)+'</span>' : '')
    : (esc(x.cn || '—') + (x.c ? ' <span class="meta">'+esc(x.c)+'</span>' : ''));
  const VT_ZH = { performance:'演奏录音', score:'乐谱' };
  const rows = [
    [t('曲名','TITLE'), esc(ttl)],
    [t('作曲家','COMPOSER'), compName],
    [t('作品编号','CATALOGUE'), x.opus ? esc(String(x.opus)) + (x.no ? (' / No. ' + esc(String(x.no))) : '') : '—'],
    // ── v1.23 新增：演奏版信息（ATEPP 的价值所在）──
    [t('版本类型','VERSION'), x.vt ? esc(LANG==='zh' ? (VT_ZH[x.vt]||x.vt) : x.vt) : t('通用','general')],
    [t('演奏者','PERFORMER'), x.perf ? esc(x.perf) : '—'],
    [t('专辑 / 录音','ALBUM'), x.alb ? esc(x.alb) : '—'],
    [t('时期','PERIOD'), x.p ? esc(LANG==='zh' ? (PERIOD_ZH[x.p]||x.p) : x.p) : '—'],
    [t('乐器 / 编制','INSTRUMENT'), x.i ? esc(LANG==='zh' ? (INST_ZH[x.i]||x.i) : x.i) : '—'],
    [t('风格','GENRE'), x.g ? esc(LANG==='zh' ? (GENRE_ZH[x.g]||x.g) : x.g) : '—'],
    [t('曲式','FORM'), x.form ? esc(x.form) : '—'],
    [t('国家 / 地域','COUNTRY / REGION'), esc([x.ctry, x.r].filter(Boolean).join(' · ') || '—')],
    [t('年代','YEAR'), x.yr ? esc(String(x.yr)) : '—'],
    [t('难度','DIFFICULTY'), x.diff ? esc(LANG==='zh' ? (DIFF_ZH[x.diff]||x.diff) : x.diff) : '—'],
    [t('时长','DURATION'), mmss(x.du)],
    [t('音符数','NOTES'), x.nn ? fmt(x.nn) : '—'],
  ];
  $('ident').innerHTML = rows.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('');

  /* ② 来源档案 */
  $('srcbox').innerHTML = src ? (
    '<div class="panel"><div class="panel-hd">'+
      '<span style="flex:none;width:96px">'+sigHTML(src.id + src.count, 20)+'</span>'+
      '<b style="font-size:var(--fs-14)">'+esc(src.name[LANG])+'</b>'+
      '<span class="lic '+z.cls+'">'+z.code+' '+z[LANG]+'</span>'+
    '</div><div class="panel-bd">'+
      '<p style="margin-bottom:var(--s3)">'+esc(src.what[LANG])+'</p>'+
      '<dl class="dl">'+
        '<dt>'+t('上游形态','UPSTREAM')+'</dt><dd>'+esc(src.method[LANG])+'</dd>'+
        '<dt>'+t('许可','LICENCE')+'</dt><dd>'+esc(src.license)+'</dd>'+
        '<dt>'+t('原始地址','HOME')+'</dt><dd><a href="'+src.url+'" target="_blank" rel="noopener">'+esc(src.url)+'</a></dd>'+
        '<dt>'+t('致谢','CREDIT')+'</dt><dd>'+esc(src.credit[LANG])+'</dd>'+
      '</dl>'+
      '<p class="meta" style="margin-top:var(--s3)">'+t('本库与来源的完整说明见 ','Full notes on sources: ')+
        '<a href="sources.html">'+t('数据来源','Sources')+'</a></p>'+
    '</div></div>'
  ) : '<div class="note">'+t('未能在来源档案中匹配到该条目的来源前缀（','No source match for prefix (')+esc(String(X.id).split('-')[0])+'）。</div>';

  /* ③ 许可与署名 */
  const attr = t(
    '音乐素材来自 midicn-lib（https://lib.midicn.com），原始来源：' + (src?src.name.zh:esc(String(X.id).split('-')[0])) +
      '（' + (src?src.url:'') + '），许可：' + (X.l||'') + '。此曲目档位：' + z.code + ' ' + z.zh + '。',
    'Music material from midicn-lib (https://lib.midicn.com). Original source: ' + (src?src.name.en:String(X.id).split('-')[0]) +
      ' (' + (src?src.url:'') + '), licence: ' + (X.l||'') + '. Tier: ' + z.code + ' ' + z.en + '.'
  );
  const allow = z.id==='main' ? t('商业使用 · 再分发 · 修改','Commercial · redistribute · modify')
    : z.id==='piano' ? t('非商业使用（须同许可方式）','Non-commercial (share-alike)')
    : t('仅学习研究 · 不得再分发','Study/research only · no redistribution');
  /* TheSession 附加条款 */
  const extraTerm = (src && src.id === 'thesession') ? t(
    '<dt>附加条款</dt><dd><b>禁止用于大语言模型（LLM）</b>——不得训练大模型、借助 LLM 工具处理，或并入 LLM 相关应用（无障碍方案除外）</dd>',
    '<dt>Additional term</dt><dd><b>Prohibition on LLM use</b> — no LLM training, no processing with LLM tools, and no incorporation into LLM-related applications (accessibility excepted)</dd>') : '';
  $('licbox').innerHTML =
    '<div class="panel"><div class="panel-hd">'+
      '<span class="lic '+z.cls+'">'+z.code+' '+z[LANG]+'</span>'+
      '<span class="meta">'+esc(X.l || '—')+'</span>'+
    '</div><div class="panel-bd">'+
      '<p style="margin-bottom:var(--s3)">'+esc(LANG==='zh'?z.zhDesc:z.enDesc)+'</p>'+
      '<dl class="dl" style="margin-bottom:var(--s4)">'+
        '<dt>'+t('可以做','ALLOWED')+'</dt><dd>'+allow+'</dd>'+
        '<dt>'+t('须署名','CREDIT')+'</dt><dd>'+t('本库与上游来源均需标注','credit both this library and the upstream')+'</dd>'+
        extraTerm+
      '</dl>'+
      '<div class="attr" id="attrtxt">'+esc(attr)+'</div>'+
      '<div class="actions" style="margin-top:var(--s3)">'+
        '<button class="btn" id="copy">'+t('复制署名','Copy attribution')+'</button>'+
        '<a class="btn ghost" href="licenses.html">'+t('完整许可条款','Full terms')+'</a>'+
      '</div>'+
    '</div></div>';
  $('copy').onclick = ()=>{
    (navigator.clipboard ? navigator.clipboard.writeText(attr) : Promise.reject())
      .then(()=>{ $('copy').textContent = t('已复制 ✓','Copied ✓');
        setTimeout(()=>{ $('copy').textContent = t('复制署名','Copy attribution'); }, 1500); })
      .catch(()=>{ $('copy').textContent = t('请手动选择','Select manually'); });
  };

  /* ④ 推荐：同作曲家 → 同时期 */
  let sim = ALL.filter(y=>y.id !== x.id && y.cn && y.cn === x.cn).slice(0, 8);
  if (sim.length < 5) {
    const seen = new Set(sim.map(y=>y.id));
    ALL.filter(y=>y.id !== x.id && y.p === x.p && !seen.has(y.id)).slice(0, 8 - sim.length)
      .forEach(y=>{ sim.push(y); seen.add(y.id); });
  }
  $('recs').innerHTML = sim.length ? sim.map(y=>
    '<a href="detail.html?id='+encodeURIComponent(y.id)+'&cat='+encodeURIComponent(CAT)+'&chunk='+CHUNK+'">'+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(y.t||y.id)+'</span>'+
      '<span>'+esc(y.cn||'')+'</span></a>').join('')
    : '<p class="meta">'+t('无相关条目','Nothing related in this shard')+'</p>';

  /* ⑤ 本曲其他演奏版（N1）：跨分片，按演奏者归组 —— 异步，不阻塞首屏 */
  renderPerf(x);

  /* 侧栏记录 */
  $('rec').innerHTML = [
    [t('标识','ID'), esc(x.id)],
    [t('分类','CATEGORY'), esc(String(CAT))],
    [t('分片','SHARD'), esc(String(CHUNK))],
    [t('文件','FILE'), esc(x.f || '—')],
    [t('许可档','TIER'), z.code + ' · ' + esc(X.l || '')],
    [t('来源前缀','SOURCE'), esc(String(x.id).split('-')[0])],
  ].map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('');

  $('dl').href = x.f || '#';
  $('inlib').href = './?cat=' + encodeURIComponent(CAT) + '&play=' + encodeURIComponent(x.id);
  $('inlib').textContent = t('在音乐库中定位此曲','Locate this track in the library');
  $('footLic') && ($('footLic').innerHTML = t(LIC_TEXT.zh, LIC_TEXT.en));
  $('footLegal').innerHTML = t(
    '数据版本 v1.23 · 本页信息随数据自动生成 · <a href="licenses.html">许可与法律</a>',
    'Data v1.23 · generated from the data · <a href="licenses.html">Licence &amp; legal</a>'
  );
  $('dl').textContent = t('下载 MIDI','Download MIDI');
  $('sfbadge').textContent = t('未加载音源','SF idle');
}

/* ═══ 播放引擎：defer 加载 + 按需追加载 + 就绪后绑定 ═══
   渲染路径完全不依赖引擎 → 引擎慢/失败时音乐库照常浏览，点播放才去取。 */
const ENGINE = ['vendor/Tone.js','vendor/Midi.js','soundfont/engine/js-synthesizer.min.js','assets/player.js'];
let ENGINE_P = null, WIRED = false;
function loadScript(src){
  return new Promise((res, rej)=>{
    const el = document.createElement('script');
    el.src = src; el.onload = ()=> res(); el.onerror = ()=> rej(new Error(src));
    document.head.appendChild(el);
  });
}
function engineLabel(){
  return t('音频引擎加载失败，请检查网络后重试','Audio engine failed to load — check your network and retry');
}
function loadEngine(){
  if (typeof Player !== 'undefined'){ wirePlayer(); return Promise.resolve(true); }
  if (ENGINE_P) return ENGINE_P;
  ENGINE_P = (async ()=>{
    for (const src of ENGINE){
      try{ await loadScript(src); }catch(e){ throw new Error(src); }
    }
    if (typeof Player === 'undefined') throw new Error('player.js');
    wirePlayer();
    return true;
  })().catch(e=>{ ENGINE_P = null; throw e; });
  return ENGINE_P;
}
/* 控件始终可用：首次点击时按需取引擎；失败只在状态条提示，不抛异常 */
function withEngine(fn){
  return async function(){
    try{ await loadEngine(); }
    catch(e){ $('times').textContent = engineLabel(); return; }
    return fn.apply(null, arguments);
  };
}
function wirePlayer(){
  if (WIRED || typeof Player === 'undefined') return;
  WIRED = true;
  Player.init({
    onState: on => { $('play').textContent = on ? '⏸' : '▶'; },
    onBadge: txt => { $('sfbadge').textContent = txt; },
    onStatus: txt => { $('times').textContent = txt; },
    onTime: (cur, total) => {
      $('times').textContent = Player.fmt(cur) + ' / ' + Player.fmt(total);
      $('prog').value = Math.min(1000, (cur / Math.max(total, .1)) * 1000);
    }
  });
}
addEventListener('load', ()=> loadEngine().catch(()=>{}));
$('play').onclick = withEngine(async ()=>{
  if (Player.isPlaying()) { Player.toggle(); return; }
  if (!X) return;
  await Player.play({ id:X.id, t:X.t, f:X.f, g:X.g, i:X.i }, 0, []);
});
$('vol').oninput = withEngine(e => Player.setVolume(Number(e.target.value)));
$('prog').oninput = withEngine(e => Player.seek(Number(e.target.value) / 1000));

applyLang();
</script>
<script src="assets/shell.js"></script>
