<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>midicn-lib · 开放 MIDI 音乐库</title>
<meta name="description" content="124,179 首开放许可 MIDI：古典钢琴、民谣、赞美诗、中国民歌等，覆盖 19 个来源、14 个分类，逐曲标注来源与许可。">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B0B0C'/%3E%3Crect x='14' y='30' width='4' height='14' fill='%23CE4A32'/%3E%3Crect x='24' y='20' width='4' height='24' fill='%23CE4A32'/%3E%3Crect x='34' y='26' width='4' height='18' fill='%23C9A227'/%3E%3Crect x='44' y='16' width='4' height='28' fill='%23C9A227'/%3E%3C/svg%3E">
<style>
/* ═══ 主页专属：档案版式 ═══ */

/* 断行卫生（同共享层，页面内再声明一次以防顺序问题）*/
.nav a,.axis,.btn,.hero-meta,.hero .kick,.listhead span,.row .src,.row .per,.row .dur{white-space:nowrap}
.hero h1,.stitle h2{text-wrap:balance}
.hero .lede{text-wrap:pretty}

/* 首屏：像一本档案的扉页 */
.hero{padding:var(--s5) 0 var(--s4);border-bottom:1px solid var(--rule)}
.hero .kick{font-family:var(--mono);font-size:var(--fs-11);color:var(--vermilion);
  letter-spacing:.18em;margin-bottom:var(--s4)}
.hero h1{font-size:var(--fs-46);line-height:1.08;letter-spacing:-.01em;margin-bottom:var(--s4)}
.hero h1 span{display:block;font-family:var(--mono);font-size:var(--fs-13);
  color:var(--paper-3);letter-spacing:.08em;margin-top:var(--s3)}
.hero .lede{max-width:60ch}
.hero-meta{margin-top:var(--s3);font-family:var(--mono);font-size:var(--fs-12);
  color:var(--paper-3);letter-spacing:.02em}
.hero-meta b{color:var(--paper);font-weight:500}

/* 浏览轴切换 */
.axes{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s5) 0 var(--s4)}
.axis{border:1px solid var(--rule);padding:var(--s2) var(--s3);font-size:var(--fs-12);
  color:var(--paper-2);min-height:36px;display:inline-flex;align-items:center;gap:var(--s2)}
.axis:hover{border-color:var(--rule-2);color:var(--paper)}
.axis.on{border-color:var(--vermilion);color:var(--paper);background:var(--vermilion-soft)}
.axis i{font-family:var(--mono);font-size:var(--fs-10);color:var(--paper-3);font-style:normal}

/* 瓦片网格 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
@media(min-width:768px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(min-width:1100px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media(min-width:1400px){ .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .listhead,.row{grid-template-columns:52px minmax(0,1fr) 150px 104px 80px 64px} }
@media(min-width:1680px){ .grid{grid-template-columns:repeat(6,minmax(0,1fr))} }
.grid .tile{padding:var(--s3) var(--s4) var(--s4);cursor:pointer;text-align:left}
.tile .tt{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.tile .tt b{font-family:var(--serif);font-size:var(--fs-14);font-weight:600}
.tile .tt .n{margin-left:auto;font-family:var(--mono);font-size:var(--fs-11);color:var(--paper-3)}
.tile .tsig{margin:var(--s2) 0 var(--s3)}
.tile .td{font-size:var(--fs-11);color:var(--paper-3);line-height:1.6;min-height:2.6em}
.tile .tlic{margin-top:var(--s2);display:flex;flex-wrap:wrap;gap:var(--s1)}

/* 筛选：内联手风琴 */
.fbar{margin:var(--s5) 0 0}
.ftoggle{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);
  padding:0 var(--s4);border:1px solid var(--rule);background:var(--ink-2);
  color:var(--paper-2);font-size:var(--fs-13)}
.ftoggle:hover{border-color:var(--rule-2);color:var(--paper)}
.ftoggle[aria-expanded="true"]{border-color:var(--vermilion);color:var(--paper);
  border-bottom-color:var(--rule)}
.ftoggle svg{width:14px;height:14px;fill:currentColor}
.ftoggle .chev{margin-left:auto;font-family:var(--mono);font-size:var(--fs-11);transition:var(--t)}
.ftoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fbadge{font-family:var(--mono);font-size:var(--fs-10);background:var(--vermilion);color:#fff;
  padding:1px 6px;min-width:18px;text-align:center}
.fpanel{border:1px solid var(--vermilion);border-top:0;background:var(--ink-2);
  padding:var(--s4);display:grid;gap:var(--s4) var(--s5);align-items:end;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fpanel[hidden]{display:none}
.fld{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.fld label{font-family:var(--mono);font-size:var(--fs-10);color:var(--paper-3);letter-spacing:.06em}
.fld select,.fld input{height:38px;padding:0 var(--s3);background:var(--ink);border:1px solid var(--rule);
  color:var(--paper);font-size:var(--fs-13);width:100%}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--vermilion)}
.fpanel .acts{grid-column:1/-1;display:flex;gap:var(--s2);flex-wrap:wrap}

/* 搜索 */
.search{position:relative;display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
.search .sw{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);
  width:15px;height:15px;fill:var(--paper-3)}
#q{width:100%;height:44px;padding:0 var(--s3) 0 38px;background:var(--ink-2);
  border:1px solid var(--rule);color:var(--paper);font-size:var(--fs-14)}
#q:focus{outline:none;border-color:var(--vermilion)}

/* 列表：档案表格化 */
.listhead{display:grid;grid-template-columns:44px minmax(0,1fr) 132px 96px 72px 60px;
  gap:var(--s3);padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule-2);
  font-family:var(--mono);font-size:var(--fs-10);color:var(--paper-3);letter-spacing:.06em}
#list{list-style:none}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 132px 96px 72px 60px;gap:var(--s3);
  align-items:center;padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);cursor:pointer}
.row:hover{background:var(--ink-3)}
.row.on{background:var(--vermilion-soft)}
.row .no{font-family:var(--mono);font-size:var(--fs-11);color:var(--paper-3)}
.row .tt{min-width:0}
.row .tt .ttl{display:block;font-size:var(--fs-13);font-weight:500;color:var(--paper);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .detbtn{grid-column:6;display:inline-flex;align-items:center;justify-content:center;
  min-height:26px;padding:0 8px;border:1px solid var(--rule);color:var(--paper-2);
  font-size:var(--fs-11);white-space:nowrap;border-radius:2px;background:transparent}
.row:hover .detbtn{border-color:var(--vermilion);color:var(--vermilion)}
.row .tt s{display:block;font-size:var(--fs-11);color:var(--paper-3);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .src,.row .per,.row .dur{font-family:var(--mono);font-size:var(--fs-11);color:var(--paper-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .per{color:var(--paper-2)}
.sk{height:52px;background:var(--ink-4);border-bottom:1px solid var(--rule);animation:shim 1.5s infinite linear;
  background-image:linear-gradient(90deg,transparent,var(--ink-3),transparent);
  background-size:220px 100%;background-repeat:no-repeat}
@keyframes shim{0%{background-position:-220px 0}100%{background-position:calc(100% + 220px) 0}}
@media(prefers-reduced-motion:reduce){ .sk{animation:none} }

/* 播放条 */
#player{position:sticky;bottom:0;z-index:var(--z-play);background:var(--ink);
  border-top:1px solid var(--rule);padding-bottom:var(--sa-b)}
.pw{max-width:var(--wrap);margin:0 auto;padding:var(--s2) clamp(var(--s4),3vw,var(--s6));
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;
  gap:var(--s4);min-height:var(--play)}
.pmeta{min-width:0}
#np{display:block;font-size:var(--fs-13);color:var(--paper);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ptime{font-family:var(--mono);font-size:var(--fs-11);color:var(--paper-3)}
#prog{width:min(34vw,380px);height:3px;-webkit-appearance:none;appearance:none;
  background:var(--rule-2);cursor:pointer}
#prog::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--vermilion);border:0}
#prog::-moz-range-thumb{width:11px;height:11px;border:0;background:var(--vermilion)}
.pctl{display:flex;align-items:center;gap:var(--s1);justify-content:flex-end}
.pctl button{min-width:36px;height:36px;display:grid;place-items:center;color:var(--paper-2);
  border:1px solid transparent}
.pctl button:hover{border-color:var(--rule-2);color:var(--paper)}
.pctl button.on{border-color:var(--vermilion);color:var(--vermilion)}
.pctl select{height:32px;background:var(--ink-2);border:1px solid var(--rule);color:var(--paper-2);
  font-size:var(--fs-11);padding:0 var(--s2)}
#vol{width:76px;height:3px;-webkit-appearance:none;appearance:none;background:var(--rule-2)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--paper-3);border:0}
#vol::-moz-range-thumb{width:10px;height:10px;border:0;background:var(--paper-3)}
.viz{display:flex;align-items:flex-end;gap:2px;height:16px;width:44px;flex:none}
.viz i{flex:1;background:var(--rule-2);height:20%;transition:height .2s}
.viz.on i{background:var(--vermilion);animation:bnc .9s infinite ease-in-out}
.viz.on i:nth-child(2){animation-delay:.1s}.viz.on i:nth-child(3){animation-delay:.2s}
.viz.on i:nth-child(4){animation-delay:.3s}.viz.on i:nth-child(5){animation-delay:.4s}
@keyframes bnc{0%,100%{height:22%}50%{height:96%}}
@media(prefers-reduced-motion:reduce){ .viz.on i{animation:none;height:60%} }

@media(max-width:900px){
  .listhead{display:none}
  .row{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"no tt dur" "no meta src";
    row-gap:2px;padding:var(--s3)}
  .row .no{grid-area:no;align-self:start;padding-top:2px}
  .row .tt{grid-area:tt}
  .row .dur{grid-area:dur;text-align:right}
  .row .src{grid-area:src;text-align:right}
  .row .per{grid-area:meta;color:var(--paper-3);font-size:var(--fs-10)}
  .row .detbtn{grid-column:3;min-height:30px;padding:0 10px}
  .row .tt .ttl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pw{grid-template-columns:1fr auto;gap:var(--s2);min-height:0;padding:var(--s3) var(--s4)}
  .pmeta{grid-column:1/-1}
  #prog{grid-column:1;width:100%}
  .pctl{grid-column:2}
  #vol,.viz{display:none}
  .pctl button{min-width:var(--tap);height:var(--tap)}
  .hero{padding:var(--s5) 0 var(--s4)}
  .hero .figs{grid-template-columns:1fr 1fr;gap:var(--s3)}
}
</style>
</head>

<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const LIC_TEXT = { zh:'代码 MIT · 元数据 CC BY 4.0 · 素材依各来源许可',
                  en:'Code MIT · metadata CC BY 4.0 · material per source' };
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ═══ 选择集合 → 加载曲目 ═══ */
async function pick(kind, id){
  COLL = { kind, id };
  paintGrid();
  const meta = collectionMeta(kind, id);
  $('listTitle').textContent = meta.title;
  rows = []; filtered = []; shown = 0; $('list').innerHTML = ''; skeleton(8);
  const cats = meta.categories;
  for (const c of cats){
    for (let i = 0; i < (c.chunks||0); i++){
      try{
        const arr = await (await fetch('data/cat-' + c.id + '-' + i + '.json')).json();
        rows = rows.concat(arr.map(x=>({ ...x, _cat:c.id, _chunk:i })));
      }catch(e){}
      if (rows.length >= 400) break;
    }
    if (rows.length >= 400) break;
  }
  applyFilter();
  loadFacets(cats.map(c=>c.id));
}
function collectionMeta(kind, id){
  if (kind === 'category'){
    const c = (SUMMARY.categories||[]).find(x=>x.id===id) || {};
    return { title: catName(c) || t('曲目','Tracks'), categories: c.id ? [c] : [] };
  }
  if (kind === 'source'){
    const cats = (SUMMARY.categories||[]).filter(c=>(c.sources||[]).includes(id));
    const s = SOURCES.find(x=>x.id===id);
    return { title: (s ? s.name[LANG] : id) + t(' · 来源',' · source'), categories: cats };
  }
  const cats = (SUMMARY.categories||[]).filter(c=>{
    const z = c.id === 'piano' ? 'piano' : (c.id === 'study' ? 'study' : 'main');
    return z === id;
  });
  const z = ZONES[id];
  return { title: z.code + ' ' + z[LANG], categories: cats };
}

function buildFilters(){
  const dims = BROWSE && BROWSE.dims ? BROWSE.dims : null;
  const fill = (sel, list, labelFn)=>{
    const el = $(sel); if (!el) return;
    el.innerHTML = '<option value="">—</option>' + (list||[]).map(v=>
      '<option value="'+v.k+'">'+labelFn(v)+'</option>').join('');
  };
  const zhName = { baroque:'巴洛克', renaissance:'文艺复兴', classical:'古典', romantic:'浪漫',
    modern:'现代', contemporary:'当代', impressionist:'印象派', traditional:'传统' };
  const instZh = { piano:'钢琴', melody:'旋律乐器', organ:'管风琴', voice:'人声', ensemble:'合奏',
    voice_piano:'人声与钢琴', drums:'打击乐', guitar:'吉他' };
  const genZh = { classical:'古典', folk:'民谣', hymn:'赞美诗', drum:'鼓乐', pop:'流行',
    christmas:'圣诞', game:'游戏', jazz:'爵士', atonal:'无调性', ragtime:'拉格泰姆',
    soundtrack:'原声', blues:'布鲁斯', rock:'摇滚' };
  if (dims){
    fill('fPeriod', dims.period, v=> (LANG==='zh' ? (zhName[v.k]||v.k) : v.k) + ' · ' + fmt(v.n));
    fill('fInst', dims.instrument, v=> (LANG==='zh' ? (instZh[v.k]||v.k) : v.k) + ' · ' + fmt(v.n));
    fill('fGenre', dims.genre, v=> (LANG==='zh' ? (genZh[v.k]||v.k) : v.k) + ' · ' + fmt(v.n));
    fill('fCountry', dims.country, v=> v.k + ' · ' + fmt(v.n));
    fill('fForm', dims.form, v=> v.k + ' · ' + fmt(v.n));
  }
  $('fZone').innerHTML = '<option value="">—</option>' + ['main','piano','study'].map(k=>
    '<option value="'+k+'">'+ZONES[k].code+' '+ZONES[k][LANG]+'</option>').join('');
  $('compList').innerHTML = ((BROWSE && BROWSE.composers) || []).map(c=>
    '<option value="'+c.k+'">'+c.n+' · '+fmt(c.n2)+'</option>').join('');
}
function applyFilter(){
  const q = ($('q').value || '').trim().toLowerCase();
  const comp = ($('fComp').value || '').trim().toLowerCase();
  const per = $('fPeriod').value, inst = $('fInst').value, gen = $('fGenre').value;
  const ctry = $('fCountry').value, form = $('fForm').value, zone = $('fZone').value, dur = $('fDur').value;
  filtered = rows.filter(x=>{
    if (comp && !((x.cn||'').toLowerCase().includes(comp) || (x.c||'').includes(comp))) return false;
    if (per && x.p !== per) return false;
    if (inst && x.i !== inst) return false;
    if (gen && x.g !== gen) return false;
    if (ctry && x.ctry !== ctry) return false;
    if (form && x.form !== form) return false;
    if (zone && (x.z||'main') !== zone) return false;
    if (dur){
      const [a,b] = dur.split('-').map(Number);
      if (!(x.du >= a && x.du < b)) return false;
    }
    if (q && !((x.t||'').toLowerCase().includes(q) || (x.cn||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const sort = $('fSort').value;
  if (sort === 't') filtered.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  if (sort === 'c') filtered.sort((a,b)=>String(a.cn).localeCompare(String(b.cn)));
  if (sort === 'd') filtered.sort((a,b)=>(a.du||0)-(b.du||0));
  shown = 0; $('list').innerHTML = '';
  renderMore();
  const n = activeCount();
  $('fbadge').hidden = n === 0; $('fbadge').textContent = n;
  $('status').textContent = t('已加载 '+fmt(filtered.length)+' / '+fmt(rows.length)+' 首',
                              fmt(filtered.length)+' / '+fmt(rows.length)+' loaded');
}
function activeCount(){
  return ['fComp','fPeriod','fInst','fGenre','fCountry','fForm','fZone','fDur']
    .filter(id=> $(id) && $(id).value).length;
}
function renderMore(){
  const ul = $('list');
  const end = Math.min(shown + PAGE, filtered.length);
  const frag = document.createDocumentFragment();
  for (let i = shown; i < end; i++){
    const x = filtered[i], el = document.createElement('li');
    el.className = 'row'; el.dataset.id = x.id;
    const src = SOURCES.find(s=>x.id.startsWith(s.id + '-')) || null;
    const srcLabel = src ? src.name[LANG] : (x.id.split('-')[0]);
    el.innerHTML =
      '<span class="no">'+String(i+1).padStart(3,'0')+'</span>'+
      '<span class="tt"><b class="ttl">'+esc(x.t||x.id)+'</b>'+
      '<s>'+esc(x.cn||'')+(x.opus?(' · Op. '+esc(String(x.opus))):'')+'</s></span>'+
      '<a class="detbtn" href="detail.html?id='+encodeURIComponent(x.id)+
      '&cat='+encodeURIComponent(x._cat||'')+'&chunk='+(x._chunk!=null?x._chunk:0)+
      '" onclick="event.stopPropagation()">'+t('详情','Details')+'</a>'+
      '<span class="src">'+esc(srcLabel)+'</span>'+
      '<span class="per">'+esc(x.p||'')+'</span>'+
      '<span class="dur">'+mmss(x.du)+'</span>';
    el.onclick = ()=> play(x, i);
    frag.appendChild(el);
  }
  ul.appendChild(frag);
  shown = end;
  $('more').hidden = shown >= filtered.length;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const mmss = s => !s ? '—' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
function skeleton(n){ $('list').innerHTML = '<li class="sk"></li>'.repeat(n); $('more').hidden = true; }

/* 深链定位：把目标曲目加载出来、滚入视野、高亮并提示 */
async function focusTrack(id){
  if (!id) return;
  let tries = 0;
  while (tries < 12){
    let i = filtered.findIndex(x => x.id === id);
    if (i < 0 && rows.some(x => x.id === id)){          // 已被筛选过滤掉 → 清空筛选
      ['fComp','fPeriod','fInst','fGenre','fCountry','fForm','fZone','fDur','fSort']
        .forEach(k => { if ($(k)) $(k).value = ''; });
      $('q').value = '';
      applyFilter();
      i = filtered.findIndex(x => x.id === id);
    }
    if (i >= 0){
      while (shown <= i && shown < filtered.length) renderMore();   // 加载到该行
      const li = document.querySelector('.row[data-id="'+id+'"]');
      if (li){
        li.classList.add('on');
        if (li.scrollIntoView) li.scrollIntoView({ block:'center' });
        const x = filtered[i];
        $('np').textContent = (x.t || x.id) + t(' · 已定位，正在播放…', ' · located, starting…');
        /* 刚从详情页点击过来 → 尝试直接播放；若被浏览器策略拦截，用户点本行即可 */
        try { await Player.play(x, i, filtered); }
        catch (e) { $('np').textContent = (x.t || x.id) + t(' · 已定位（点击本行播放）', ' · located (tap the row to play)'); }
        return;
      }
    }
    // 分片可能尚未加载该曲目 → 继续拉取更多
    if (shown >= filtered.length && rows.length >= 400) break;
    await new Promise(r => setTimeout(r, 250));
    tries++;
  }
  $('np').textContent = '未在当前分类中找到 ' + id;
}

function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h = setTimeout(()=>fn(...a), ms); }; }
$('clear').onclick = ()=>{

/* 全库搜索（走 search-lite 索引）*/
let SL = null;
async function searchAll(q){
  if (!q || q.length < 2) return null;
  if (!SL){ try{ SL = await (await fetch('data/search-lite.json')).json(); }catch(e){ return null; } }
  const lq = q.toLowerCase();
  return SL.filter(r=>String(r[1]).toLowerCase().includes(lq) || String(r[2]).toLowerCase().includes(lq)).slice(0, 200);

Player.init({

  onBadge: txt => { $('sfbadge').textContent = txt; },

  onTime: (cur, total) => {

async function play(x, i){
  curIdx = (typeof i === 'number') ? i : curIdx;
  document.querySelectorAll('.row.on').forEach(e=>e.classList.remove('on'));
  const li = document.querySelector('.row[data-id="'+x.id+'"]'); if (li) li.classList.add('on');
  await Player.play(x, i, filtered);
}

$('next').onclick = ()=> Player.next();
$('loop').onclick = e => { const on = !e.currentTarget.classList.contains('on');
  e.currentTarget.classList.toggle('on', on); Player.setLoop(on); };
$('vol').oninput = e => Player.setVolume(Number(e.target.value));
$('prog').oninput = e => Player.seek(Number(e.target.value) / 1000);
$('rate').onchange = ()=>{};   /* 保留控件位；变速由后续版本接入 */

/* 启动：先按当前语言渲染外壳，再加载数据 */
applyLang();
</script>
</body>
</html>
