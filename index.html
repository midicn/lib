<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>midicn-lib · MIDI 音乐库</title>

<style>
/* ── 主页专有组件（复用 style.css 的配色变量） ── */
main{max-width:1260px}
.search-wrap{flex:1;min-width:180px;position:relative;order:2}
#q{width:100%;padding:.5rem .85rem .5rem 2.1rem;border-radius:var(--rs);border:1px solid var(--bd);
  background:var(--surface);color:var(--tx);font-size:13.5px;outline:none;transition:.2s;backdrop-filter:blur(8px)}
#q:focus{border-color:var(--bd-hi);box-shadow:0 0 0 4px var(--halo1)}
#q::placeholder{color:var(--dim2)}
.search-wrap svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--dim2)}
header .nav{margin-left:0}
@media(max-width:860px){.nav{order:3;width:100%;margin-left:0}}
.hero h1{font-size:clamp(1.8rem,4.6vw,2.9rem)}
.stats{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1rem;margin-bottom:1.1rem}
.stat b{display:block;font-size:20px;font-weight:600;color:var(--accent);letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:.78rem;margin-bottom:1.7rem}
.cat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:.9rem 1rem;
  cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1),border-color .22s,box-shadow .22s;
  display:flex;gap:.8rem;align-items:center;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.cat::after{content:'';position:absolute;inset:0;border-radius:var(--r);opacity:0;transition:opacity .22s;
  background:radial-gradient(220px 80px at 20% 0%,var(--halo1),transparent 70%)}
.cat:hover{transform:translateY(-3px);border-color:var(--bd-hi);box-shadow:0 14px 36px -12px var(--halo1)}
.cat:hover::after{opacity:1}
.cat.on{border-color:var(--p1);background:var(--surface-hi);box-shadow:0 0 0 1px var(--p1),0 14px 36px -14px var(--halo1)}
.cat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,var(--halo1),var(--halo2));border:1px solid var(--bd)}
.cat .ico svg{width:19px;height:19px;fill:var(--p2)}
.cat b{display:block;font-size:13.5px;font-weight:500;margin-bottom:.12rem;letter-spacing:-.01em}
.cat span{font-size:11.5px;color:var(--dim)}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem;padding:.6rem .75rem;
  background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(14px)}
.chk{display:flex;align-items:center;gap:.34rem;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.chk input{accent-color:var(--p1);width:14px;height:14px;cursor:pointer}
#status{font-size:12.5px;color:var(--dim);margin:.55rem .2rem .6rem}
#list{list-style:none}
.row{display:flex;align-items:center;gap:.75rem;padding:.52rem .72rem;border-radius:var(--rs);cursor:pointer;
  transition:background .15s,transform .15s;font-size:13.5px;border:1px solid transparent}
.row:hover{background:var(--surface);border-color:var(--bd);transform:translateX(2px)}
.row.on{background:linear-gradient(90deg,var(--halo1),transparent);border-color:var(--bd-hi);box-shadow:inset 3px 0 0 var(--accent)}
.row .pl{width:15px;flex-shrink:0;color:var(--p2);font-size:11px;opacity:.8;transition:.15s}
.row:hover .pl,.row.on .pl{color:var(--accent);opacity:1}
.row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--dim);font-size:12px}
.row .meta{flex-shrink:0;color:var(--dim2);font-size:11.5px;white-space:nowrap;display:flex;gap:.45rem;
  align-items:center;font-variant-numeric:tabular-nums}
.pill{font-size:10.5px;padding:.06rem .46rem;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim)}
:root[data-theme=light] .pill{background:rgba(0,0,0,.05)}
.pill.nc{background:rgba(232,197,71,.16);color:var(--accent)}
.pill.st{background:rgba(123,196,154,.16);color:var(--ok)}
.pill.sf{background:rgba(224,122,63,.2);color:var(--p2)}
.sk{height:34px;border-radius:9px;margin:.26rem 0;overflow:hidden;position:relative;background:rgba(255,255,255,.04)}
:root[data-theme=light] .sk{background:rgba(0,0,0,.04)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--halo1),transparent);animation:shim 1.5s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.cat.sk{height:74px;border:none}
#player{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--ink2) 88%,transparent);backdrop-filter:blur(22px) saturate(150%);
  border-top:1px solid var(--bd)}
#player::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--p1),var(--accent),transparent)}
.pwrap{max-width:1260px;margin:0 auto;padding:.55rem 1.1rem .62rem}
.ptop{display:flex;align-items:center;gap:.7rem;font-size:12.5px}
#np{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptime{color:var(--dim2);font-variant-numeric:tabular-nums;font-size:11.5px}
#prog{width:100%;height:4px;margin:.45rem 0 .32rem;-webkit-appearance:none;appearance:none;border-radius:2px;
  background:linear-gradient(90deg,var(--p1) 0%,var(--accent) var(--p,0%),rgba(255,255,255,.09) var(--p,0%));
  cursor:pointer;outline:none}
:root[data-theme=light] #prog{background:linear-gradient(90deg,var(--p1) 0%,var(--accent) var(--p,0%),rgba(0,0,0,.1) var(--p,0%))}
#prog::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px rgba(232,197,71,.18);cursor:pointer;transition:.15s}
#prog::-webkit-slider-thumb:hover{transform:scale(1.15)}
#prog::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent)}
.pctl{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.pctl button{padding:.3rem .62rem;border-radius:8px;border:1px solid var(--bd);background:rgba(255,255,255,.04);
  color:var(--tx);cursor:pointer;font-size:12px;transition:.18s}
:root[data-theme=light] .pctl button{background:rgba(0,0,0,.03)}
.pctl button:hover{border-color:var(--bd-hi);color:var(--accent)}
.pctl button.on{background:rgba(232,197,71,.16);border-color:var(--accent);color:var(--accent)}
#vol{width:78px;accent-color:var(--p1)}
.viz{display:flex;align-items:flex-end;gap:2.5px;height:26px;width:104px;flex-shrink:0}
.viz i{flex:1;height:4px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--p1));
  opacity:.35;transition:height .18s,opacity .18s}
.viz.on i{opacity:1;animation:bounce .9s ease-in-out infinite}
@keyframes bounce{0%,100%{height:5px}50%{height:24px}}
@media(prefers-reduced-motion:reduce){.viz.on i{animation:none;height:12px}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cat,.row{animation:rise .34s cubic-bezier(.2,.8,.3,1) both}
@media(max-width:720px){
  .cats{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:.6rem}
  .stats{gap:1rem}.stat b{font-size:16px}
  .row .meta .pill{display:none}#vol{display:none}.viz{width:64px;height:22px}
  body{padding-bottom:118px}
}
</style>

<script>
const $ = id => document.getElementById(id);
const PAGE = 80;
let SUMMARY=null, curCat=null, chunkIdx=0, buf=[], flat=[], rendered=0, curIdx=-1;
let SEARCH=null, searchReady=false, playing=false, looping=false, curTotal=1;

/* ── 国际化 ── */
const I18N = {
  zh:{ load:'加载', playing:'采样音源', synth:'合成音源', loadingSF:'音源加载中', noTitle:'(无题)',
       hint:'点击分类开始浏览，或直接搜索', total:'共', tracks:'首', loaded:'已加载',
       searching:'首次搜索：加载全库索引…', found:'搜索「', hit:'」命中', entries:'条',
       shuffling:'随机试听：', failed:'播放失败：', noNotes:'该曲无音符',
       tracksUnit:'曲目', sourcesUnit:'来源', commercialUnit:'可商用', catsUnit:'分类',
       commercial:'可商用', study:'研究学习', nc:'非商用',
       hero:'收录 {n} 首 · {s} 个来源数据集 · 统一整理 / 质量验证 / 许可分区 · GM 采样音源' },
  en:{ load:'Loading', playing:'SoundFont', synth:'Synth', loadingSF:'Loading soundfont', noTitle:'(untitled)',
       hint:'Pick a category or search', total:'', tracks:'tracks', loaded:'loaded',
       searching:'First search: loading index…', found:'"', hit:'" matched', entries:'',
       shuffling:'Shuffle: ', failed:'Playback failed: ', noNotes:'No notes in this track',
       tracksUnit:'Tracks', sourcesUnit:'Sources', commercialUnit:'Commercial', catsUnit:'Categories',
       commercial:'Commercial', study:'Study', nc:'Non-comm.',
       hero:'{n} tracks · {s} source datasets · unified, verified, license-zoned · GM SoundFont' }
};
let LANG = localStorage.getItem('midicn-lang') || 'zh';
const t = k => I18N[LANG][k];
const catName = c => { const p = c.name.split(' · '); return LANG === 'zh' ? p[0] : (p[1] || p[0]); };

/* 声波可视化条 */
(function(){ const v=$('viz'); for(let i=0;i<14;i++){ const b=document.createElement('i');
  b.style.animationDelay=(i*0.07)+'s'; v.appendChild(b); } })();

/* 主题 */
if (localStorage.getItem('midicn-theme')) document.documentElement.dataset.theme = localStorage.getItem('midicn-theme');
$('theme').onclick = () => { const c = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = c; localStorage.setItem('midicn-theme', c); };

/* ── 音频 ── */
let ready=false, syn=null, bass=null, perc=null, part=null;
let sfSynth=null, sfReady=false, sfLoading=false, sfFailed=false;
const volDb = () => -36 + ($('vol').value/100)*36;
function initAudio(){
  if(ready) return;
  const verb = new Tone.Reverb({decay:3.0,preDelay:.015,wet:.26}).connect(Tone.Destination);
  const filt = new Tone.Filter({type:'lowpass',frequency:5200,rolloff:-12}).connect(verb);
  const comp = new Tone.Compressor({threshold:-20,ratio:2.6,attack:.01,release:.25}).connect(filt);
  syn = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'amtriangle',harmonicity:2.02,modulationType:'sine'},
    envelope:{attack:.004,decay:1.35,sustain:.1,release:2.0},volume:-9}).connect(comp);
  bass = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'sine'},
    envelope:{attack:.012,decay:1.1,sustain:.16,release:1.6},volume:-11}).connect(comp);
  perc = new Tone.PolySynth(Tone.MembraneSynth,{volume:-6}).connect(comp);
  Tone.Destination.volume.value = volDb();
  ready=true;
}
$('vol').oninput = () => { if(ready) Tone.Destination.volume.value = volDb(); };
$('rate').onchange = e => { if(ready) Tone.Transport.timeScale = parseFloat(e.target.value); };
function setBadge(txt, cls){ const el=$('sfbadge'); el.textContent=txt; el.className='pill '+(cls||''); }
async function ensureSoundFont(){
  if(sfReady||sfLoading||sfFailed) return;
  sfLoading=true; setBadge(t('loadingSF'));
  try{
    const AC = Tone.getContext().rawContext;
    sfSynth = new JSSynth.AudioWorkletNodeSynthesizer();
    await sfSynth.init(AC);
    const sf = await (await fetch('soundfont/GeneralUser-GS.sf2')).arrayBuffer();
    await sfSynth.loadSFont(sf);
    sfReady=true; setBadge(t('playing'),'sf');
  }catch(e){ sfFailed=true; setBadge(t('synth')); }
  sfLoading=false;
}
const fmt = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
let uiTimer=null;
function ticker(){
  clearInterval(uiTimer);
  uiTimer=setInterval(()=>{ if(!playing||!ready) return;
    const pos=Tone.Transport.seconds;
    $('tcur').textContent=fmt(pos);
    const p=Math.min(1000,(pos/Math.max(curTotal,.1))*1000);
    $('prog').value=p; $('prog').style.setProperty('--p',(p/10)+'%');
    if(pos>=curTotal) onEnded();
  },250);
}
function stop(){
  clearInterval(uiTimer);
  if(sfSynth){ try{ sfSynth.stop(); }catch(e){} }
  if(part){ try{part.stop();part.dispose();}catch(e){} part=null; }
  try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
  if(ready){ syn.releaseAll(); bass.releaseAll(); perc.releaseAll(); }
  playing=false; $('play').textContent='▶'; $('viz').classList.remove('on');
}
function onEnded(){ if(looping && curIdx>=0 && flat[curIdx]) play(flat[curIdx],curIdx); else stop(); }
function zoneLabel(z){ return z==='main'?t('commercial'):(z==='study'?t('study'):(z?t('nc'):'')); }

async function play(x, idx){
  stop();
  if(idx!==undefined) curIdx=idx;
  document.querySelectorAll('.row.on').forEach(e=>e.classList.remove('on'));
  const li=document.querySelector('.row[data-id="'+x.id+'"]'); if(li) li.classList.add('on');
  $('np').textContent = t('load')+' ' + (x.t || x.id) + ' …';
  $('tag').textContent = zoneLabel(x.z);
  $('tag').className = 'pill ' + (x.z==='main' ? 'st' : (x.z==='study' ? '' : 'nc'));
  if(sfReady){
    try{
      await Tone.start();
      const ab = await (await fetch(x.f)).arrayBuffer();
      sfSynth.stop(); await sfSynth.playNewMIDI(ab);
      playing=true; $('play').textContent='⏸'; $('viz').classList.add('on');
      $('np').textContent=(x.t||x.id)+(x.cn?' · '+x.cn:'')+' · '+t('playing');
      setBadge(t('playing'),'sf'); return;
    }catch(e){}
  }
  ensureSoundFont();
  try{
    initAudio(); await Tone.start();
    const ab = await (await fetch(x.f)).arrayBuffer();
    const midi = new Midi(ab);
    const notes=[];
    midi.tracks.forEach(tr => tr.notes.forEach(n => notes.push({
      time:n.time, name:n.name, dur:Math.max(n.duration,.05), vel:n.velocity, pitch:n.midi })));
    if(!notes.length){ $('np').textContent=t('noNotes'); return; }
    const isPerc = (x.g==='drum') || /drum|perc/i.test(x.i||'');
    Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.position=0;
    part = new Tone.Part((time,n)=>{
      const v=Math.min(1,Math.max(.15,n.vel||.7));
      if(isPerc) perc.triggerAttackRelease(n.pitch<50?'C1':'G2',.12,time,v*.9);
      else if(n.pitch<48) bass.triggerAttackRelease(n.name,n.dur,time,v*.85);
      else syn.triggerAttackRelease(n.name,n.dur,time,v);
    }, notes);
    part.start(0);
    curTotal=Math.round(midi.duration)||1; $('ttot').textContent=fmt(curTotal);
    part.stop(curTotal+1.5); Tone.Transport.start('+0.08');
    playing=true; $('play').textContent='⏸'; $('viz').classList.add('on');
    $('np').textContent=(x.t||x.id)+(x.cn?' · '+x.cn:'')+' · '+fmt(curTotal);
    ticker();
  }catch(e){ $('np').textContent=t('failed')+((e&&e.message)||e); }
}

const ICONS = {
  'folk-ireland':'M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9a2 2 0 110-4 2 2 0 010 4z',
  'folk-world':'M12 2a10 10 0 100 20 10 10 0 000-20zm0 3c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3zm0 14c-2.5 0-4.7-1.3-6-3.2.2-1.9 2.5-3.3 6-3.3s5.8 1.4 6 3.3c-1.3 1.9-3.5 3.2-6 3.2z',
  'piano':'M4 4h16v16H4V4zm2 2v8h2V6H6zm4 0v8h2V6h-2zm4 0v8h2V6h-2zm4 0v8h2V6h-2z',
  'classical-traditional':'M12 3v10.55A4 4 0 1014 17V7h4V3h-6z',
  'classical-open':'M6 3v12a3 3 0 003 3 3 3 0 100-6 3 3 0 00-1 .2V6l10-2v9a3 3 0 003 3 3 3 0 100-6 3 3 0 00-1 .2V3L6 5z',
  'klezmer-balkan':'M12 2l4 6h-2v6h2l-4 8-4-8h2V8H8l4-6z',
  'drum':'M12 4c-4.4 0-8 1.3-8 3v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7c0-1.7-3.6-3-8-3zm0 5c-3.3 0-6-.9-6-2s2.7-2 6-2 6 .9 6 2-2.7 2-6 2z',
  'folk-british':'M10 2v14.6a4 4 0 101.5 3.1V6h2V2h-3.5z',
  'game':'M6 6h12a4 4 0 014 4v4a4 4 0 01-4 4h-1l-2-2h-6l-2 2H6a4 4 0 01-4-4v-4a4 4 0 014-4zm1 3v2H5v2h2v2h2v-2h2v-2H9V9H7zm8.5 1a1.5 1.5 0 100 3 1.5 1.5 0 000-3z'
};
function skeleton(n){ const box=$('cats'); for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='cat sk'; box.appendChild(d); } }
function skList(n){ $('list').innerHTML='<li class="sk"></li>'.repeat(n); }

async function boot(){
  skeleton(8); skList(6);
  $('np').textContent = '—';
  try{ SUMMARY = await (await fetch('data/summary.json')).json(); }
  catch(e){ $('heroSub').textContent = 'Load failed: ' + e.message; return; }
  const nsrc = Object.keys(SUMMARY.sources||{}).length;
  $('heroSub').textContent = t('hero').replace('{n}', SUMMARY.total.toLocaleString()).replace('{s}', nsrc);
  $('stats').innerHTML =
    '<div class="stat"><b>'+SUMMARY.total.toLocaleString()+'</b><span>'+t('tracksUnit')+'</span></div>'+
    '<div class="stat"><b>'+nsrc+'</b><span>'+t('sourcesUnit')+'</span></div>'+
    '<div class="stat"><b>'+(SUMMARY.zones?(SUMMARY.zones.main||0).toLocaleString():'—')+'</b><span>'+t('commercialUnit')+'</span></div>'+
    '<div class="stat"><b>'+(SUMMARY.categories?SUMMARY.categories.length:'—')+'</b><span>'+t('catsUnit')+'</span></div>';
  $('cats').innerHTML=''; renderCats();
  const per=[...new Set(SUMMARY.categories.flatMap(c=>c.periods))];
  const sel=$('period'); sel.innerHTML='<option value="">'+(LANG==='zh'?'全部时期':'All periods')+'</option>';
  per.sort().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o); });
  $('status').textContent = t('hint') + ' · ' + SUMMARY.total.toLocaleString() + ' ' + t('tracks');
  $('list').innerHTML='';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function renderCats(){
  SUMMARY.categories.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='cat'; d.style.animationDelay=(i*.03)+'s';
    d.innerHTML='<span class="ico"><svg viewBox="0 0 24 24"><path d="'+(ICONS[c.id]||ICONS['classical-traditional'])+'"/></svg></span><span><b>'+catName(c)+'</b><span>'+c.count.toLocaleString()+' '+t('tracks')+' · '+c.sources.length+' '+t('sourcesUnit')+'</span></span>';
    d.onclick=()=>selectCat(c,d);
    $('cats').appendChild(d);
  });
}
async function selectCat(c, el){
  document.querySelectorAll('.cat.on').forEach(e=>e.classList.remove('on'));
  if(el) el.classList.add('on');
  curCat=c; chunkIdx=0; buf=[]; flat=[]; rendered=0; curIdx=-1;
  skList(8);
  await loadChunk();
}
async function loadChunk(){
  if(!curCat || chunkIdx>=curCat.chunks) return;
  const r=await fetch('data/cat-'+curCat.id+'-'+chunkIdx+'.json');
  const part=await r.json(); chunkIdx++;
  buf=buf.concat(part);
  if(chunkIdx===1) $('list').innerHTML='';
  flat=buf.filter(pass); rendered=0; renderNext(true);
  $('status').textContent = catName(curCat)+' · '+t('loaded')+' '+buf.length.toLocaleString()+' / '+curCat.count.toLocaleString();
}
function pass(x){
  if($('mainOnly').checked && x.z!=='main') return false;
  const p=$('period').value; if(p && x.p!==p) return false;
  const d=$('dur').value;
  if(d){ const [lo,hi]=d.split('-').map(Number); const v=x.du||0;
    if(v && (v<lo||v>hi)) return false; if(!v && lo>0) return false; }
  return true;
}
function renderNext(fresh){
  const ul=$('list'); if(fresh) ul.innerHTML='';
  let added=0;
  while(rendered<flat.length && added<PAGE){ ul.appendChild(rowFor(flat[rendered],rendered)); rendered++; added++; }
}
function rowFor(x, idx){
  const li=document.createElement('li'); li.className='row'; li.dataset.id=x.id;
  const tags=[];
  if(x.z && x.z!=='main') tags.push('<span class="pill '+(x.z==='study'?'':'nc')+'">'+(x.z==='study'?t('study'):'NC')+'</span>');
  li.innerHTML='<span class="pl">▶</span><span class="tt">'+(x.t||t('noTitle')).slice(0,70)+'<span class="sub"> '+(x.cn||'').slice(0,26)+'</span></span><span class="meta">'+(x.du?fmt(x.du)+' · ':'')+[x.p,x.r].filter(Boolean).join(' · ')+' '+tags.join('')+'</span>';
  li.onclick=()=>play(x, idx);
  return li;
}
new IntersectionObserver(async e=>{
  if(!e[0].isIntersecting) return;
  if(curCat && buf.length-rendered<PAGE*2 && chunkIdx<curCat.chunks) await loadChunk();
  else renderNext();
}, {rootMargin:'500px'}).observe($('sentinel'));

$('q').oninput=(function(){ let h; return function(e){ clearTimeout(h); h=setTimeout(async function(){
  const q=e.target.value.trim().toLowerCase();
  if(!q){ if(curCat) await selectCat(curCat); else $('list').innerHTML=''; return; }
  if(!searchReady){ $('status').textContent=t('searching');
    SEARCH=await (await fetch('data/search-lite.json')).json(); searchReady=true; }
  const hits=SEARCH.filter(function(row){
    const id=row[0],tt=row[1],cn=row[2];
    return (tt&&tt.toLowerCase().indexOf(q)>=0)||(cn&&cn.toLowerCase().indexOf(q)>=0)||id.indexOf(q)>=0;
  }).slice(0,400);
  flat=hits.map(function(row){
    const id=row[0],tt=row[1],cn=row[2],cat=row[3];
    const isPiano=cat==='piano';
    return {id:id,t:tt,cn:cn,g:cat,z:isPiano?'piano-special':'main',
            f:(isPiano?'piano-special/piano/':'main/'+cat+'/')+id+'.mid'};
  });
  $('list').innerHTML=''; rendered=0;
  $('status').textContent=t('found')+e.target.value.trim()+t('hit')+' '+hits.length+(hits.length>=400?'+':'')+' '+t('entries');
  flat.forEach(function(x,i){ $('list').appendChild(rowFor(x,i)); });
  rendered=flat.length;
},260); }; })();

$('play').onclick=()=>{ if(playing) stop(); else if(flat[curIdx]) play(flat[curIdx],curIdx); else if(flat[0]) play(flat[0],0); };
$('prev').onclick=()=>{ if(curIdx>0) play(flat[curIdx-1],curIdx-1); };
$('next').onclick=()=>{ if(curIdx<flat.length-1) play(flat[curIdx+1],curIdx+1); };
$('loop').onclick=()=>{ looping=!looping; $('loop').classList.toggle('on',looping); };
$('rand').onclick=async()=>{
  const c=SUMMARY.categories[Math.floor(Math.random()*SUMMARY.categories.length)];
  const i=Math.floor(Math.random()*c.chunks);
  $('status').textContent=t('shuffling')+catName(c)+' …';
  const arr=await (await fetch('data/cat-'+c.id+'-'+i+'.json')).json();
  const x=arr[Math.floor(Math.random()*arr.length)];
  if(x) play(x);
};
$('mainOnly').onchange=()=>{ if(curCat) selectCat(curCat); };
$('period').onchange=()=>{ if(curCat) selectCat(curCat); };
$('dur').onchange=()=>{ if(curCat) selectCat(curCat); };
$('sort').onchange=(e)=>{ const k=e.target.value; if(!k) return;
  flat.sort((a,b)=>String(a[k]||'~').localeCompare(String(b[k]||'~'))); rendered=0; renderNext(true); };

/* ── 语言切换 ── */
function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = LANG === 'zh' ? 'midicn-lib · MIDI 音乐库' : 'midicn-lib · MIDI Music Library';
  document.querySelectorAll('[data-zh]').forEach(el => el.textContent = LANG === 'zh' ? el.dataset.zh : el.dataset.en);
  document.querySelectorAll('[data-ph-zh]').forEach(el => el.placeholder = LANG === 'zh' ? el.dataset.phZh : el.dataset.phEn);
  // 动态区域重建
  if(SUMMARY){ boot(); } else { $('np').textContent='—'; }
}
$('lang').onclick=()=>{ LANG = LANG==='zh'?'en':'zh'; localStorage.setItem('midicn-lang',LANG);
  $('lang').textContent = LANG==='zh'?'EN':'中'; applyLang(); };
$('lang').textContent = LANG==='zh'?'EN':'中';

document.addEventListener('pointerdown',()=>ensureSoundFont(),{once:true});
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key===' '){ e.preventDefault(); $('play').click(); }
  else if(e.key==='ArrowLeft'){ $('prev').click(); }
  else if(e.key==='ArrowRight'){ $('next').click(); }
  else if(e.key==='/'){ e.preventDefault(); $('q').focus(); }
  else if(e.key==='Escape'){ stop(); }
});
applyLang();
</script>
