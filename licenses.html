<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

let LANG = store.get('midicn-lang', null) || 'zh';
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const $ = id => document.getElementById(id);

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh';
  store.set('midicn-lang', LANG); applyLang(); };
const themeBtn = $('theme');
function setTheme(v){ document.documentElement.dataset.theme = v; store.set('midicn-theme', v); }
setTheme(store.get('midicn-theme', null) || 'dark');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

function render(){
  /* 导语 */
  $('lede').innerHTML = t(
    '本库把开放许可的 MIDI 汇集、统一格式并补全元数据。我们的立场很明确：<em>素材的权利属于来源方</em>，使用者必须遵守各来源的原始条款；本页把每一条款写清楚，并提供可直接使用的署名模板。',
    'This library gathers openly licensed MIDI, normalises the format and enriches metadata. Our position is plain: <em>rights belong to the sources</em>, and users must follow each source\u2019s terms. This page states them precisely and provides a ready attribution template.'
  );

  /* ⓪ 本库自身许可 */
  const own = LANG === 'zh' ? [
    ['站点与工具代码', '<b>MIT</b>', 'HTML / CSS / JS / Python 构建脚本。极简宽松：只需保留版权与许可声明，可自由商用、修改、再分发。'],
    ['本库自有的元数据与文档', '<b>CC BY 4.0</b>', 'catalog.json、各类索引、分类与来源说明文本。只需署名，无其他限制；CC BY 4.0 明确覆盖数据库权利，适合数据集。'],
    ['上游 MIDI 素材', '<b>依各来源许可</b>', '本库<strong>无权</strong>对这些素材另行授权——其权利与许可属于各上游来源，请按来源页与逐曲 l 字段标注的条款使用。'],
  ] : [
    ['Site and tooling code', '<b>MIT</b>', 'HTML / CSS / JS / Python build scripts. Minimal and permissive: keep the copyright and licence notice; commercial use, modification and redistribution are all allowed.'],
    ['Our own metadata and docs', '<b>CC BY 4.0</b>', 'catalog.json, indexes, category and source notes. Attribution only, no further restrictions; CC BY 4.0 explicitly covers database rights, which suits a dataset.'],
    ['Upstream MIDI material', '<b>Per-source licence</b>', 'This library <strong>cannot</strong> relicense source material — rights and licences belong to each upstream. Follow the terms noted on the sources page and the per-track l field.'],
  ];
  $('ownlic').innerHTML = own.map(([h, l, b]) =>
    '<div class="panel"><div class="panel-hd"><b style="font-size:var(--fs-14)">'+h+'</b>'+
    '<span style="margin-left:auto"></span><span class="lic c1 plain">'+l+'</span></div>'+
    '<div class="panel-bd"><p style="margin:0">'+b+'</p></div></div>').join('');
  $('ownlicNote').innerHTML = t(
    '为什么这样选：<b>MIT</b> 是软件许可，最适合代码，几乎不加限制；<b>CC BY 4.0</b> 是内容/数据许可，'+
    '明确覆盖数据库权利、同样只要求署名。两者叠加＝<b>最大开放度 + 唯一要求是署名</b>，与我们尊重来源方的立场一致。',
    'Why this split: <b>MIT</b> is a software licence — the natural fit for code, with almost no restrictions; '+
    '<b>CC BY 4.0</b> is a content/data licence that explicitly covers database rights and likewise asks only for attribution. '+
    'Together they give <b>maximum openness with attribution as the single requirement</b>.'
  );

  /* ① 档位 */
  const zoneOrder = ['main','piano','study'];
  const allow = {
    main:  {zh:['商业项目、应用、游戏、视频配乐','再分发与修改','训练数据与研究'], en:['Commercial projects, apps, games, video','Redistribution and modification','Training data and research']},
    piano: {zh:['个人练习、学习与创作','非公开演出','研究与非商业发布'], en:['Personal practice, study, creation','Non-public performance','Research and non-commercial release']},
    study: {zh:['学习、教学、研究引用','古籍与传统音乐的学术研究'], en:['Study, teaching, research citation','Scholarly work on traditional music']},
  };
  const deny = {
    main:  {zh:['移除或更改来源署名','声称对原始素材拥有权利'], en:['Removing or altering attribution','Claiming rights over the source material']},
    piano: {zh:['任何商业用途（需另行取得授权）','以相同方式许可的再分发之外的使用'], en:['Any commercial use (requires separate permission)','Uses beyond share-alike redistribution']},
    study: {zh:['再分发、二次发布任何形式','商业用途','用于训练商业模型'], en:['Redistribution in any form','Commercial use','Use in commercial model training']},
  };
  $('zones').innerHTML = zoneOrder.map(k=>{
    const z = ZONES[k];
    const cnt = SOURCES.filter(s=>s.zone===k).reduce((a,s)=>a+s.count,0);
    return '<div class="panel"><div class="panel-hd">'+
      '<span class="lic '+z.cls+'">'+z.code+' '+z[LANG]+'</span>'+
      '<span class="meta">'+fmt(cnt)+t(' 首',' tracks')+'</span>'+
      '<span style="margin-left:auto"></span>'+
      '<span class="meta">'+SOURCES.filter(s=>s.zone===k).length+t(' 个来源',' sources')+'</span></div>'+
      '<div class="panel-bd"><p style="margin-bottom:var(--s3)">'+z[LANG==='zh'?'zhDesc':'enDesc']+'</p>'+
      '<dl class="dl">'+
        '<dt>'+t('可以做','ALLOWED')+'</dt><dd>'+allow[k][LANG].join(' · ')+'</dd>'+
        '<dt>'+t('不可以','NOT ALLOWED')+'</dt><dd>'+deny[k][LANG].join(' · ')+'</dd>'+
      '</dl></div></div>';
  }).join('');

  /* ② 矩阵 */
  $('matrix').innerHTML =
    '<thead><tr><th>'+t('来源','Source')+'</th><th>'+t('许可','Licence')+'</th><th>'+t('档位','Tier')+
    '</th><th>'+t('商用','Commercial')+'</th><th>'+t('再分发','Redistribute')+'</th><th>'+t('原始地址','Home')+'</th></tr></thead><tbody>'+
    SOURCES.map(s=>{
      const z = zoneOf(s.zone);
      const l = s.license.toLowerCase();
      const comm = s.zone==='main' ? t('允许','Yes') : t('禁止','No');
      const redis = (l.includes('traditional')||l.includes('study')) ? t('禁止','No')
        : (s.zone==='main' ? t('允许（须署名）','Yes (attribute)') : t('限同许可方式','Share-alike only'));
      return '<tr><td><b>'+s.name[LANG]+'</b></td><td>'+s.license+'</td>'+
        '<td><span class="lic '+z.cls+'">'+z.code+'</span></td><td>'+comm+'</td><td>'+redis+'</td>'+
        '<td><a href="'+s.url+'" target="_blank" rel="noopener">'+t('访问','open')+'</a></td></tr>';
    }).join('') +
    EXCLUDED.map(s=>'<tr><td><b>'+s.name[LANG]+'</b></td><td>'+s.license+'</td>'+
      '<td><span class="lic no">'+t('排除','EXCLUDED')+'</span></td><td colspan="2">'+t('未收录，不在任何下载包内','Not included in any pack')+'</td>'+
      '<td><a href="'+s.url+'" target="_blank" rel="noopener">'+t('访问','open')+'</a></td></tr>').join('') +
    '</tbody>';

  /* ③ 署名 */
  $('attrIntro').innerHTML = t(
    '使用本库数据时，请同时注明<strong>本库</strong>与<strong>上游来源</strong>。多数条目标注了来源与许可，可直接取用；下方模板可直接复制进你的项目。',
    'When you use this data, credit both <strong>this library</strong> and the <strong>upstream source</strong>. Each track carries its source and licence; copy the template below.'
  );
  $('attrTmpl').textContent = t(
    '音乐素材来自 midicn-lib（https://lib.midicn.com），原始来源：{来源名}（{原始地址}），'
      + '许可：{许可}。本作品按原许可条款使用。',
    'Music material from midicn-lib (https://lib.midicn.com). Original source: {source name} ({home URL}), '
      + 'licence: {licence}. Used under the terms of that licence.'
  );
  $('attrNote').innerHTML = t(
    '示例：音乐素材来自 midicn-lib，原始来源：The Session（https://thesession.org/），许可：CC BY-SA 4.0。',
    'Example: Music from midicn-lib; original source: The Session (https://thesession.org/); licence CC BY-SA 4.0.'
  );

  /* ④ 对来源方的立场 */
  const respect = LANG === 'zh' ? [
    ['整理者而非权利人', '本库是整理与转译项目。我们不主张对任何原始素材享有权利，也不替代来源网站的功能——请在可能的情况下直接访问并支持原站。'],
    ['署名优先', '我们为每一首曲目保留来源与许可字段，并在来源页写明上游整理方式与致谢。若你发现署名缺失或不准确，请告知，我们会立即修正。'],
    ['来源优先', '当上游更新、变更许可或要求调整收录方式时，我们以来源方的意愿为准，包括完整移除相关数据。'],
    ['不做商业转售', '本库及其下载包本身免费提供，不用于转售素材；C2/C3 档位数据尤其不得用于任何商业用途。'],
    ['尊重社区劳动', '许多来源由志愿者社群长期维护（The Session、Mutopia、OpenScore、Norbeck 等）。请在其条款范围内使用，并为社区回馈力所能及的贡献。'],
  ] : [
    ['Custodians, not rights holders', 'This is a curation project. We claim no rights over source material and do not replace the upstream sites — where possible, visit and support the originals.'],
    ['Attribution first', 'Source and licence are kept per track, with acquisition notes and credit on the sources page. If any attribution is missing or wrong, tell us and we fix it immediately.'],
    ['Sources come first', 'If an upstream updates, changes licence, or asks us to adjust, their wish governs — including full removal of the affected data.'],
    ['No resale', 'The library and its packs are free and are not used to resell material; C2/C3 data in particular must not be used commercially.'],
    ['Respect community labour', 'Many sources are maintained by volunteers (The Session, Mutopia, OpenScore, Norbeck…). Use within their terms and give back where you can.'],
  ];
  $('respect').innerHTML = respect.map(([h,b])=>(
    '<div class="panel"><div class="panel-hd"><b style="font-size:var(--fs-14)">'+h+'</b></div>'+
    '<div class="panel-bd"><p style="margin:0">'+b+'</p></div></div>'
  )).join('');

  /* ⑤ 使用指引 */
  $('usage').innerHTML =
    '<thead><tr><th>'+t('场景','Use case')+'</th><th>C1 '+ZONES.main[LANG]+'</th><th>C2 '+ZONES.piano[LANG]+'</th><th>C3 '+ZONES.study[LANG]+'</th></tr></thead><tbody>'+
    (LANG==='zh' ? [
      ['练习 / 学习','可以','可以','可以'],
      ['个人创作（不发布）','可以','可以','可以'],
      ['发布作品（免费）','可以（署名）','可以（非商用 + 同许可方式）','不可以'],
      ['商业产品 / 广告 / 游戏','可以（署名）','需取得授权','不可以'],
      ['作为机器学习训练数据（非商业）','可以','可以（非商业）','需先咨询'],
      ['作为机器学习训练数据（商业）','可以（署名）','需取得授权','不可以'],
      ['再分发给第三方','可以（保留署名与许可）','仅同许可方式','不可以'],
    ] : [
      ['Practice / study','Yes','Yes','Yes'],
      ['Personal creation (unpublished)','Yes','Yes','Yes'],
      ['Release a work (free)','Yes (attribute)','Yes (non-commercial, share-alike)','No'],
      ['Commercial product / ads / games','Yes (attribute)','Permission required','No'],
      ['ML training data (non-commercial)','Yes','Yes (non-commercial)','Ask first'],
      ['ML training data (commercial)','Yes (attribute)','Permission required','No'],
      ['Redistribute to third parties','Yes (keep attribution)','Share-alike only','No'],
    ]).map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+
    '</tbody>';

  /* ⑥ 法律声明 */
  const legal = LANG === 'zh' ? [
    ['素材权利归属', 'MIDI 文件的权利状态取决于其上游：乐谱排版、转录、录音与数据集编译各自可能产生权利。我们按来源标注许可，但不构成法律意见。使用者应自行核实具体用途的合规性。'],
    ['作品本身可能另有版权', '许多古典作品已进入公有领域，但<strong>特定编订版、转录或演奏录音</strong>可能仍受保护。C2/C3 档位的数据即属此类情形，请特别留意。'],
    ['元数据准确性', '我们尽力核对作曲家、作品编号、时期等字段（含 IMSLP 官方目录交叉验证），但元数据可能存在错误或遗漏。发现错误请提交 issue，我们会修正。'],
    ['无担保', '本库按「现状」提供，不附带任何明示或默示担保，包括可商售性与特定用途适用性。因使用本库数据产生的任何后果由使用者自行承担。'],
    ['商标与名称', '各来源名称、机构名称与商标归其各自所有者；本库在来源页与许可页的引用属于说明性使用，不表示任何赞助或背书关系。'],
    ['下架与异议流程', '权利人若认为某项内容侵犯其权利，请通过开源项目 issue 或邮件提供：作品标识（id 或文件名）、权利依据、诉求。我们会在核实后 <strong>48 小时内</strong>下架相关数据并更新发布版本。'],
  ] : [
    ['Rights in the material', 'The rights status of a MIDI file depends on its upstream: typesetting, transcription, performance and dataset compilation may each create rights. We label licences as recorded by sources, but this is not legal advice.'],
    ['Works may carry separate rights', 'Many works are public domain, yet <strong>specific editions, transcriptions or recordings</strong> may still be protected — which is exactly the case for C2/C3 data.'],
    ['Metadata accuracy', 'We verify composers, catalogue numbers and periods (including IMSLP cross-checks), but errors are possible. Report them and we will fix them.'],
    ['No warranty', 'The library is provided "as is", without warranty of any kind, express or implied, including merchantability or fitness for a particular purpose.'],
    ['Trademarks and names', 'Source, institution and product names belong to their owners; references here are descriptive and imply no sponsorship or endorsement.'],
    ['Takedown and objections', 'Rights holders may open an issue or email us with the track id or filename, the basis of the claim and the requested action. Verified requests are honoured within <strong>48 hours</strong>.'],
  ];
  $('legal').innerHTML = legal.map(([h,b])=>
    '<h3>'+h+'</h3><p>'+b+'</p>').join('');

  $('contact').innerHTML = t(
    '联系与异议：<a href="https://github.com/midicn/midi-lib/issues" target="_blank" rel="noopener">开源项目 issue</a>（推荐，公开可追溯）。我们会公开记录每一次调整。',
    'Contact: <a href="https://github.com/midicn/midi-lib/issues" target="_blank" rel="noopener">open-source project issue</a> (public and traceable). Every adjustment is recorded publicly.'
  );
  $('footNote').innerHTML = t('本页为使用条款说明，不构成法律意见。','This page explains terms of use; it is not legal advice.');
  $('footLic') && ($('footLic').innerHTML = t(LIB_LICENCE.zh, LIB_LICENCE.en));
  $('footLegal').innerHTML = t(
    '数据版本 v1.19 · 许可信息随数据一同发布（meta/catalog.json 的 <code>l</code> 字段）',
    'Data v1.19 · licence metadata ships with the data (<code>l</code> field in meta/catalog.json)'
  );
}
applyLang();
</script>
