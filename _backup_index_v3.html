<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080F">
<title>midicn-lib · MIDI 音乐库</title>
<meta name="description" content="92,649 首 MIDI 在线试听：爱尔兰传统、世界民谣、古典钢琴、游戏音乐等 18 个来源数据集，统一整理、质量验证、许可分区。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230A0A14'/%3E%3Crect x='14' y='26' width='5' height='15' rx='2.5' fill='%236C5CE7' opacity='.5'/%3E%3Crect x='23' y='18' width='5' height='31' rx='2.5' fill='%236C5CE7' opacity='.75'/%3E%3Crect x='32' y='29' width='5' height='12' rx='2.5' fill='%23F4C95D'/%3E%3Cpath d='M43 16h5v22l-5 4z' fill='%23F4C95D'/%3E%3Cellipse cx='41' cy='41' rx='7.5' ry='5.5' transform='rotate(-18 41 41)' fill='%23F4C95D'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<script src="vendor/Tone.js"></script>
<script src="vendor/Midi.js"></script>
<script src="soundfont/engine/js-synthesizer.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --ink:#08080F; --ink2:#0F0F1E; --surface:rgba(22,22,46,.62); --surface-hi:rgba(30,30,60,.72);
  --bd:rgba(140,140,220,.16); --bd-hi:rgba(167,139,250,.45);
  --tx:#EDEDF5; --dim:#8B8BA8; --dim2:#5C5C78;
  --vio:#6C5CE7; --vio2:#A78BFA; --vio3:#C4B5FD; --gold:#F4C95D; --gold2:#FFE29A;
  --ok:#5FD6A0;
  --r:14px; --rs:10px;
}
:root[data-theme=light]{
  color-scheme:light;
  --ink:#F6F6FB; --ink2:#EDEDF6; --surface:rgba(255,255,255,.78); --surface-hi:rgba(255,255,255,.92);
  --bd:rgba(30,30,80,.12); --bd-hi:rgba(108,92,231,.45);
  --tx:#17172A; --dim:#5F5F7A; --dim2:#9A9AB0;
  --vio:#5B4BD6; --vio2:#7C6AF0; --vio3:#5B4BD6; --gold:#B8860B; --gold2:#996F00;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--ink); color:var(--tx); line-height:1.55; font-size:14px; padding-bottom:92px;
  -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
}
/* 氛围光晕（纯 CSS，无图片） */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 18% -8%, rgba(108,92,231,.34), transparent 62%),
    radial-gradient(700px 420px at 88% -4%, rgba(244,201,93,.13), transparent 60%),
    radial-gradient(1100px 700px at 50% 108%, rgba(108,92,231,.16), transparent 65%);
}
/* 细星点纹理 */
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 0);
  background-size:44px 44px;
}
:root[data-theme=light] body::after{opacity:.6;background-image:radial-gradient(rgba(40,40,90,.10) 1px, transparent 0)}
a{color:var(--vio3);text-decoration:none;transition:.15s}
a:hover{color:var(--gold)}
button{font-family:inherit}
::selection{background:rgba(108,92,231,.4)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--vio),var(--vio2));border-radius:6px;border:3px solid var(--ink)}
::-webkit-scrollbar-track{background:transparent}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ink) 72%,transparent);
  backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--bd)}
.hbar{max-width:1260px;margin:0 auto;padding:.65rem 1.1rem;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;cursor:pointer;user-select:none}
.brand svg{width:30px;height:30px;flex-shrink:0}
.brand .nm{font-weight:600;font-size:15.5px;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 10%,var(--vio3) 55%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:10px;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase}
.search-wrap{flex:1;min-width:180px;position:relative}
#q{width:100%;padding:.55rem .9rem .55rem 2.2rem;border-radius:var(--rs);border:1px solid var(--bd);
  background:var(--surface);color:var(--tx);font-size:13.5px;outline:none;transition:.2s;backdrop-filter:blur(8px)}
#q:focus{border-color:var(--bd-hi);box-shadow:0 0 0 4px rgba(108,92,231,.14)}
#q::placeholder{color:var(--dim2)}
.search-wrap svg{position:absolute;left:.72rem;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--dim2)}
.icobtn{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--surface);
  color:var(--dim);cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:.2s;backdrop-filter:blur(8px)}
.icobtn:hover{border-color:var(--bd-hi);color:var(--gold);transform:translateY(-1px)}
.icobtn svg{width:16px;height:16px;fill:currentColor}
main{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:1.6rem 1.1rem 2.4rem}

/* Hero */
.hero{margin-bottom:1.6rem}
.hero h1{font-size:clamp(1.7rem,4.4vw,2.7rem);font-weight:700;letter-spacing:-.035em;line-height:1.12;
  background:linear-gradient(100deg,#fff 6%,var(--vio3) 52%,var(--gold) 96%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
:root[data-theme=light] .hero h1{background:linear-gradient(100deg,#1a1a2e 6%,var(--vio) 55%,var(--gold) 96%);
  -webkit-background-clip:text;background-clip:text}
.hero p{color:var(--dim);font-size:13.5px;max-width:64ch}
.hero .stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:.9rem}
.hero .stat b{display:block;font-size:19px;font-weight:600;color:var(--gold);letter-spacing:-.02em}
.hero .stat span{font-size:11px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
.hero .links{margin-top:.9rem;display:flex;gap:1.1rem;flex-wrap:wrap;font-size:12.5px}

/* 分类卡（玻璃拟态） */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:.75rem;margin-bottom:1.6rem}
.cat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:.9rem 1rem;
  cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1),border-color .22s,box-shadow .22s;
  display:flex;gap:.8rem;align-items:center;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.cat::after{content:'';position:absolute;inset:0;border-radius:var(--r);opacity:0;transition:opacity .22s;
  background:radial-gradient(220px 80px at 20% 0%,rgba(108,92,231,.30),transparent 70%)}
.cat:hover{transform:translateY(-3px);border-color:var(--bd-hi);box-shadow:0 14px 36px -12px rgba(108,92,231,.55)}
.cat:hover::after{opacity:1}
.cat.on{border-color:var(--vio2);background:var(--surface-hi);box-shadow:0 0 0 1px var(--vio2),0 14px 36px -14px rgba(108,92,231,.6)}
.cat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,rgba(108,92,231,.32),rgba(244,201,93,.14));border:1px solid var(--bd)}
.cat .ico svg{width:19px;height:19px;fill:var(--vio3)}
.cat b{display:block;font-size:13.5px;font-weight:500;margin-bottom:.12rem;letter-spacing:-.01em}
.cat span{font-size:11.5px;color:var(--dim)}

/* 工具栏 */
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem;padding:.6rem .75rem;
  background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(14px)}
select,.btn{padding:.4rem .66rem;border-radius:9px;border:1px solid var(--bd);background:rgba(255,255,255,.04);
  color:var(--tx);font-size:12.5px;cursor:pointer;outline:none;transition:.18s}
:root[data-theme=light] select,:root[data-theme=light] .btn{background:rgba(0,0,0,.03)}
select:hover,.btn:hover{border-color:var(--bd-hi)}
.btn.primary{background:linear-gradient(135deg,rgba(108,92,231,.9),rgba(167,139,250,.75));border-color:transparent;
  color:#fff;font-weight:500;box-shadow:0 6px 20px -8px rgba(108,92,231,.9)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 26px -8px rgba(108,92,231,1)}
.chk{display:flex;align-items:center;gap:.34rem;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.chk input{accent-color:var(--vio);width:14px;height:14px;cursor:pointer}
.spacer{flex:1}
#status{font-size:12.5px;color:var(--dim);margin:.55rem .2rem .6rem}

/* 列表 */
#list{list-style:none}
.row{display:flex;align-items:center;gap:.75rem;padding:.52rem .72rem;border-radius:var(--rs);cursor:pointer;
  transition:background .15s,transform .15s;font-size:13.5px;border:1px solid transparent}
.row:hover{background:var(--surface);border-color:var(--bd);transform:translateX(2px)}
.row.on{background:linear-gradient(90deg,rgba(108,92,231,.22),rgba(108,92,231,.06));
  border-color:var(--bd-hi);box-shadow:inset 3px 0 0 var(--gold)}
.row .pl{width:15px;flex-shrink:0;color:var(--vio2);font-size:11px;opacity:.8;transition:.15s}
.row:hover .pl{color:var(--gold);opacity:1}
.row.on .pl{color:var(--gold);opacity:1}
.row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--dim);font-size:12px}
.row .meta{flex-shrink:0;color:var(--dim2);font-size:11.5px;white-space:nowrap;display:flex;gap:.45rem;align-items:center;
  font-variant-numeric:tabular-nums}
.pill{font-size:10.5px;padding:.06rem .46rem;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim)}
:root[data-theme=light] .pill{background:rgba(0,0,0,.05)}
.pill.nc{background:rgba(244,201,93,.15);color:var(--gold)}
.pill.st{background:rgba(95,214,160,.15);color:var(--ok)}
.pill.sf{background:rgba(108,92,231,.2);color:var(--vio3)}
.sk{height:34px;border-radius:9px;margin:.26rem 0;overflow:hidden;position:relative;background:rgba(255,255,255,.04)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.16),transparent);animation:shim 1.5s infinite}
@keyframes shim{100%{transform:translateX(100%)}}
.cat.sk{height:74px;border:none}

/* 播放器 */
#player{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--ink2) 86%,transparent);backdrop-filter:blur(22px) saturate(150%);
  border-top:1px solid var(--bd)}
#player::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(108,92,231,.65),rgba(244,201,93,.5),transparent)}
.pwrap{max-width:1260px;margin:0 auto;padding:.55rem 1.1rem .62rem}
.ptop{display:flex;align-items:center;gap:.7rem;font-size:12.5px}
#np{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptime{color:var(--dim2);font-variant-numeric:tabular-nums;font-size:11.5px}
#prog{width:100%;height:4px;margin:.45rem 0 .32rem;-webkit-appearance:none;appearance:none;border-radius:2px;
  background:linear-gradient(90deg,var(--vio) 0%,var(--vio2) var(--p,0%),rgba(255,255,255,.09) var(--p,0%));
  cursor:pointer;outline:none}
#prog::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 4px rgba(244,201,93,.18);cursor:pointer;transition:.15s}
#prog::-webkit-slider-thumb:hover{transform:scale(1.15)}
#prog::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--gold)}
.pctl{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.pctl button{padding:.3rem .62rem;border-radius:8px;border:1px solid var(--bd);background:rgba(255,255,255,.04);
  color:var(--tx);cursor:pointer;font-size:12px;transition:.18s}
:root[data-theme=light] .pctl button{background:rgba(0,0,0,.03)}
.pctl button:hover{border-color:var(--bd-hi);color:var(--gold)}
.pctl button.on{background:rgba(244,201,93,.16);border-color:var(--gold);color:var(--gold)}
#vol{width:78px;accent-color:var(--vio2)}

/* 声波可视化 */
.viz{display:flex;align-items:flex-end;gap:2.5px;height:26px;width:104px;flex-shrink:0}
.viz i{flex:1;height:4px;border-radius:2px;background:linear-gradient(180deg,var(--gold2),var(--vio));
  opacity:.35;transition:height .18s,opacity .18s}
.viz.on i{opacity:1;animation:bounce .9s ease-in-out infinite}
@keyframes bounce{0%,100%{height:5px}50%{height:24px}}
@media(prefers-reduced-motion:reduce){.viz.on i{animation:none;height:12px}}

/* 淡入 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cat,.row{animation:rise .34s cubic-bezier(.2,.8,.3,1) both}

footer{position:relative;z-index:1;max-width:1260px;margin:2.4rem auto 0;padding:1.2rem 1.1rem 0;
  border-top:1px solid var(--bd);font-size:11.5px;color:var(--dim2);line-height:1.8}

@media(max-width:720px){
  .cats{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:.6rem}
  .hero .stats{gap:1rem}.hero .stat b{font-size:16px}
  .row .meta .pill{display:none}#vol{display:none}.viz{width:64px;height:22px}
  body{padding-bottom:118px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand" onclick="location.reload()">
      <svg viewBox="0 0 64 64" aria-label="midicn-lib">
        <rect width="64" height="64" rx="15" fill="#0A0A14"/>
        <g transform="translate(32,32)">
          <rect x="-18" y="-6" width="5" height="15" rx="2.5" fill="#6C5CE7" opacity=".5"/>
          <rect x="-9" y="-14" width="5" height="31" rx="2.5" fill="#6C5CE7" opacity=".75"/>
          <rect y="-3" width="5" height="12" rx="2.5" fill="#F4C95D"/>
          <path d="M11 -16h5v22l-5 4z" fill="#F4C95D"/>
          <ellipse cx="9" cy="9" rx="7.5" ry="5.5" transform="rotate(-18 9 9)" fill="#F4C95D"/>

<main>
  <div class="hero">
    <h1>MIDI 音乐库</h1>
    <p id="heroSub">正在加载目录…</p>

<script>
const $ = id => document.getElementById(id);
const PAGE = 80;
let SUMMARY=null, curCat=null, chunkIdx=0, buf=[], flat=[], rendered=0, curIdx=-1;
let SEARCH=null, searchReady=false, playing=false, looping=false, curTotal=1;

/* 声波可视化条 */
(function(){ const v=$('viz'); for(let i=0;i<14;i++){ const b=document.createElement('i');
  b.style.animationDelay=(i*0.07)+'s'; v.appendChild(b); } })();

const savedTheme = localStorage.getItem('midicn-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('midicn-theme', cur);
};

/* ── 音频：FluidSynth 采样音源（优先）+ 合成器回退 ── */
let ready=false, syn=null, bass=null, perc=null, part=null;
let sfSynth=null, sfReady=false, sfLoading=false, sfFailed=false;
const volDb = () => -36 + ($('vol').value/100)*36;
function initAudio(){
  if(ready) return;
  const verb = new Tone.Reverb({decay:3.0,preDelay:.015,wet:.26}).connect(Tone.Destination);
  const filt = new Tone.Filter({type:'lowpass',frequency:5200,rolloff:-12}).connect(verb);
  const comp = new Tone.Compressor({threshold:-20,ratio:2.6,attack:.01,release:.25}).connect(filt);
  syn = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'amtriangle',harmonicity:2.02,modulationType:'sine'},
    envelope:{attack:.004,decay:1.35,sustain:.1,release:2.0},volume:-9}).connect(comp);
  bass = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'sine'},
    envelope:{attack:.012,decay:1.1,sustain:.16,release:1.6},volume:-11}).connect(comp);
  perc = new Tone.PolySynth(Tone.MembraneSynth,{volume:-6}).connect(comp);
  Tone.Destination.volume.value = volDb();
  ready=true;
}
$('vol').oninput = () => { if(ready) Tone.Destination.volume.value = volDb(); };
$('rate').onchange = e => { if(ready) Tone.Transport.timeScale = parseFloat(e.target.value); };

function setBadge(t, cls){ const el=$('sfbadge'); el.textContent=t; el.className='pill '+(cls||''); }
async function ensureSoundFont(){
  if(sfReady||sfLoading||sfFailed) return;
  sfLoading=true; setBadge('音源加载中');
  try{
    const AC = Tone.getContext().rawContext;
    sfSynth = new JSSynth.AudioWorkletNodeSynthesizer();
    await sfSynth.init(AC);
    const sf = await (await fetch('soundfont/GeneralUser-GS.sf2')).arrayBuffer();
    await sfSynth.loadSFont(sf);
    sfReady=true; setBadge('采样音源','sf');
  }catch(e){ sfFailed=true; setBadge('合成音源'); }
  sfLoading=false;
}

const fmt = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
let uiTimer=null;
function ticker(){
  clearInterval(uiTimer);
  uiTimer=setInterval(()=>{ if(!playing||!ready) return;
    const pos=Tone.Transport.seconds;
    $('tcur').textContent=fmt(pos);
    const p=Math.min(1000,(pos/Math.max(curTotal,.1))*1000);
    $('prog').value=p; $('prog').style.setProperty('--p',(p/10)+'%');
    if(pos>=curTotal) onEnded();
  },250);
}
function stop(){
  clearInterval(uiTimer);
  if(sfSynth){ try{ sfSynth.stop(); }catch(e){} }
  if(part){ try{part.stop();part.dispose();}catch(e){} part=null; }
  try{ Tone.Transport.stop(); Tone.Transport.cancel(); }catch(e){}
  if(ready){ syn.releaseAll(); bass.releaseAll(); perc.releaseAll(); }
  playing=false; $('play').textContent='▶'; $('viz').classList.remove('on');
}
function onEnded(){ if(looping && curIdx>=0 && flat[curIdx]) play(flat[curIdx], curIdx); else stop(); }

async function play(t, idx){
  stop();
  if(idx!==undefined) curIdx=idx;
  document.querySelectorAll('.row.on').forEach(e=>e.classList.remove('on'));
  const li=document.querySelector('.row[data-id="'+t.id+'"]'); if(li) li.classList.add('on');
  $('np').textContent = '加载 ' + (t.t || t.id) + ' …';
  $('tag').textContent = t.z==='main' ? '可商用' : (t.z==='study' ? '研究学习' : (t.z ? '非商用' : ''));
  $('tag').className = 'pill ' + (t.z==='main' ? 'st' : (t.z==='study' ? '' : 'nc'));

  if(sfReady){
    try{
      await Tone.start();
      const ab = await (await fetch(t.f)).arrayBuffer();
      sfSynth.stop();
      await sfSynth.playNewMIDI(ab);
      playing=true; $('play').textContent='⏸'; $('viz').classList.add('on');
      $('np').textContent = (t.t || t.id) + (t.cn ? ' · '+t.cn : '') + ' · 采样音源';
      setBadge('采样音源','sf');
      return;
    }catch(e){ /* 回退 */ }
  }
  ensureSoundFont();
  try{
    initAudio(); await Tone.start();
    const ab = await (await fetch(t.f)).arrayBuffer();
    const midi = new Midi(ab);
    const notes=[];
    midi.tracks.forEach(tr => tr.notes.forEach(n => notes.push({
      time:n.time, name:n.name, dur:Math.max(n.duration,.05), vel:n.velocity, pitch:n.midi })));
    if(!notes.length){ $('np').textContent='该曲无音符'; return; }
    const isPerc = (t.g==='drum') || /drum|perc/i.test(t.i||'');
    Tone.Transport.stop(); Tone.Transport.cancel(); Tone.Transport.position=0;
    part = new Tone.Part((time,n)=>{
      const v=Math.min(1,Math.max(.15,n.vel||.7));
      if(isPerc) perc.triggerAttackRelease(n.pitch<50?'C1':'G2',.12,time,v*.9);
      else if(n.pitch<48) bass.triggerAttackRelease(n.name,n.dur,time,v*.85);
      else syn.triggerAttackRelease(n.name,n.dur,time,v);
    }, notes);
    part.start(0);
    curTotal = Math.round(midi.duration)||1;
    $('ttot').textContent = fmt(curTotal);
    part.stop(curTotal+1.5);
    Tone.Transport.start('+0.08');
    playing=true; $('play').textContent='⏸'; $('viz').classList.add('on');
    $('np').textContent = (t.t||t.id) + (t.cn?' · '+t.cn:'') + ' · '+fmt(curTotal);
    ticker();
  }catch(e){ $('np').textContent='播放失败：'+((e&&e.message)||e); }
}

const ICONS = {
  'folk-ireland':'M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9a2 2 0 110-4 2 2 0 010 4z',
  'folk-world':'M12 2a10 10 0 100 20 10 10 0 000-20zm0 3c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3zm0 14c-2.5 0-4.7-1.3-6-3.2.2-1.9 2.5-3.3 6-3.3s5.8 1.4 6 3.3c-1.3 1.9-3.5 3.2-6 3.2z',
  'piano':'M4 4h16v16H4V4zm2 2v8h2V6H6zm4 0v8h2V6h-2zm4 0v8h2V6h-2zm4 0v8h2V6h-2z',
  'classical-traditional':'M12 3v10.55A4 4 0 1014 17V7h4V3h-6z',
  'classical-open':'M6 3v12a3 3 0 003 3 3 3 0 100-6 3 3 0 00-1 .2V6l10-2v9a3 3 0 003 3 3 3 0 100-6 3 3 0 00-1 .2V3L6 5z',
  'klezmer-balkan':'M12 2l4 6h-2v6h2l-4 8-4-8h2V8H8l4-6z',
  'drum':'M12 4c-4.4 0-8 1.3-8 3v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7c0-1.7-3.6-3-8-3zm0 5c-3.3 0-6-.9-6-2s2.7-2 6-2 6 .9 6 2-2.7 2-6 2z',
  'folk-british':'M10 2v14.6a4 4 0 101.5 3.1V6h2V2h-3.5z',
  'game':'M6 6h12a4 4 0 014 4v4a4 4 0 01-4 4h-1l-2-2h-6l-2 2H6a4 4 0 01-4-4v-4a4 4 0 014-4zm1 3v2H5v2h2v2h2v-2h2v-2H9V9H7zm8.5 1a1.5 1.5 0 100 3 1.5 1.5 0 000-3z'
};
function skeleton(n){ const box=$('cats'); for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='cat sk'; box.appendChild(d); } }
function skList(n){ $('list').innerHTML='<li class="sk"></li>'.repeat(n); }

async function boot(){
  skeleton(8); skList(6);
  try{ SUMMARY = await (await fetch('data/summary.json')).json(); }
  catch(e){ $('heroSub').textContent='加载失败：'+e.message; return; }
  const nsrc = Object.keys(SUMMARY.sources||{}).length;
  $('heroSub').textContent = '收录 ' + SUMMARY.total.toLocaleString() + ' 首 · ' + nsrc + ' 个来源数据集 · 统一整理 / 质量验证 / 许可分区 · GM 采样音源';
  $('stats').innerHTML =
    '<div class="stat"><b>'+SUMMARY.total.toLocaleString()+'</b><span>曲目</span></div>'+
    '<div class="stat"><b>'+nsrc+'</b><span>来源</span></div>'+
    '<div class="stat"><b>'+(SUMMARY.zones?(SUMMARY.zones.main||0).toLocaleString():'—')+'</b><span>可商用</span></div>'+
    '<div class="stat"><b>'+(SUMMARY.categories?SUMMARY.categories.length:'—')+'</b><span>分类</span></div>';
  $('cats').innerHTML=''; renderCats();
  const per=[...new Set(SUMMARY.categories.flatMap(c=>c.periods))];
  per.sort().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; $('period').appendChild(o); });
  $('status').textContent = '点击分类开始浏览，或直接搜索 · 共 ' + SUMMARY.total.toLocaleString() + ' 首';
  $('list').innerHTML='';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function renderCats(){
  SUMMARY.categories.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='cat'; d.style.animationDelay=(i*.03)+'s';
    d.innerHTML='<span class="ico"><svg viewBox="0 0 24 24"><path d="'+(ICONS[c.id]||ICONS['classical-traditional'])+'"/></svg></span><span><b>'+c.name.split(' · ')[0]+'</b><span>'+c.count.toLocaleString()+' 首 · '+c.sources.length+' 源</span></span>';
    d.onclick=()=>selectCat(c,d);
    $('cats').appendChild(d);
  });
}
async function selectCat(c, el){
  document.querySelectorAll('.cat.on').forEach(e=>e.classList.remove('on'));
  if(el) el.classList.add('on');
  curCat=c; chunkIdx=0; buf=[]; flat=[]; rendered=0; curIdx=-1;
  skList(8);
  await loadChunk();
}
async function loadChunk(){
  if(!curCat || chunkIdx>=curCat.chunks) return;
  const r=await fetch('data/cat-'+curCat.id+'-'+chunkIdx+'.json');
  const part=await r.json(); chunkIdx++;
  buf=buf.concat(part);
  if(chunkIdx===1) $('list').innerHTML='';
  flat=buf.filter(pass); rendered=0; renderNext(true);
  $('status').textContent = curCat.name.split(' · ')[0] + ' · 已加载 ' + buf.length.toLocaleString() + ' / ' + curCat.count.toLocaleString() + ' 首';
}
function pass(t){
  if($('mainOnly').checked && t.z!=='main') return false;
  const p=$('period').value; if(p && t.p!==p) return false;
  const d=$('dur').value;
  if(d){ const [lo,hi]=d.split('-').map(Number); const x=t.du||0;
    if(x && (x<lo||x>hi)) return false; if(!x && lo>0) return false; }
  return true;
}
function renderNext(fresh){
  const ul=$('list'); if(fresh) ul.innerHTML='';
  let added=0;
  while(rendered<flat.length && added<PAGE){
    ul.appendChild(rowFor(flat[rendered], rendered)); rendered++; added++;
  }
}
function rowFor(t, idx){
  const li=document.createElement('li'); li.className='row'; li.dataset.id=t.id;
  const tags=[];
  if(t.z && t.z!=='main') tags.push('<span class="pill '+(t.z==='study'?'':'nc')+'">'+(t.z==='study'?'研究':'NC')+'</span>');
  li.innerHTML='<span class="pl">▶</span><span class="tt">'+(t.t||'(无题)').slice(0,70)+'<span class="sub"> '+(t.cn||'').slice(0,26)+'</span></span><span class="meta">'+(t.du?fmt(t.du)+' · ':'')+[t.p,t.r].filter(Boolean).join(' · ')+' '+tags.join('')+'</span>';
  li.onclick=()=>play(t, idx);
  return li;
}
new IntersectionObserver(async e=>{
  if(!e[0].isIntersecting) return;
  if(curCat && buf.length-rendered<PAGE*2 && chunkIdx<curCat.chunks) await loadChunk();
  else renderNext();
}, {rootMargin:'500px'}).observe($('sentinel'));

$('q').oninput=(function(){ let h; return function(e){ clearTimeout(h); h=setTimeout(async function(){
  const q=e.target.value.trim().toLowerCase();
  if(!q){ if(curCat) await selectCat(curCat); else $('list').innerHTML=''; return; }
  if(!searchReady){ $('status').textContent='首次搜索：加载全库索引…';
    SEARCH=await (await fetch('data/search-lite.json')).json(); searchReady=true; }
  const hits=SEARCH.filter(function(row){
    const id=row[0],t=row[1],cn=row[2];
    return (t&&t.toLowerCase().indexOf(q)>=0)||(cn&&cn.toLowerCase().indexOf(q)>=0)||id.indexOf(q)>=0;
  }).slice(0,400);
  flat=hits.map(function(row){
    const id=row[0],t=row[1],cn=row[2],cat=row[3];
    const isPiano=cat==='piano';
    return {id:id,t:t,cn:cn,g:cat,z:isPiano?'piano-special':'main',
            f:(isPiano?'piano-special/piano/':'main/'+cat+'/')+id+'.mid'};
  });
  $('list').innerHTML=''; rendered=0;
  $('status').textContent='搜索「'+e.target.value.trim()+'」命中 '+hits.length+(hits.length>=400?'+':'')+' 条';
  flat.forEach(function(t,i){ $('list').appendChild(rowFor(t,i)); });
  rendered=flat.length;
},260); }; })();

$('play').onclick=()=>{ if(playing) stop(); else if(flat[curIdx]) play(flat[curIdx],curIdx); else if(flat[0]) play(flat[0],0); };
$('prev').onclick=()=>{ if(curIdx>0) play(flat[curIdx-1],curIdx-1); };
$('next').onclick=()=>{ if(curIdx<flat.length-1) play(flat[curIdx+1],curIdx+1); };
$('loop').onclick=()=>{ looping=!looping; $('loop').classList.toggle('on',looping); };
$('rand').onclick=async()=>{
  const c=SUMMARY.categories[Math.floor(Math.random()*SUMMARY.categories.length)];
  const i=Math.floor(Math.random()*c.chunks);
  $('status').textContent='随机试听：'+c.name.split(' · ')[0]+' …';
  const arr=await (await fetch('data/cat-'+c.id+'-'+i+'.json')).json();
  const t=arr[Math.floor(Math.random()*arr.length)];
  if(t) play(t);
};
$('mainOnly').onchange=()=>{ if(curCat) selectCat(curCat); };
$('period').onchange=()=>{ if(curCat) selectCat(curCat); };
$('dur').onchange=()=>{ if(curCat) selectCat(curCat); };
$('sort').onchange=(e)=>{ const k=e.target.value; if(!k) return;
  flat.sort((a,b)=>String(a[k]||'~').localeCompare(String(b[k]||'~'))); rendered=0; renderNext(true); };

document.addEventListener('pointerdown',()=>ensureSoundFont(),{once:true});
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key===' '){ e.preventDefault(); $('play').click(); }
  else if(e.key==='ArrowLeft'){ $('prev').click(); }
  else if(e.key==='ArrowRight'){ $('next').click(); }
  else if(e.key==='/'){ e.preventDefault(); $('q').focus(); }
  else if(e.key==='Escape'){ stop(); }
});
boot();
</script>
