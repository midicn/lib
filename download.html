<script src="assets/archive.js"></script>
<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

let LANG = store.get('midicn-lang', null) || 'zh';
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const $ = id => document.getElementById(id);

const VER = 'v1.19';
const REL = 'https://github.com/midicn/midi-lib/releases/download/' + VER + '/';
const PAGE = 'https://github.com/midicn/midi-lib/releases/tag/' + VER;

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh';
  store.set('midicn-lang', LANG); applyLang(); };
const themeBtn = $('theme');
function setTheme(v){ document.documentElement.dataset.theme = v; store.set('midicn-theme', v); }
setTheme(store.get('midicn-theme', null) || 'dark');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

const DL_ICON = '<svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>';

function pkgCard(o){
  return '<div class="pkg">'+
    '<div class="pn">'+o.name+'</div>'+
    '<div class="pm">'+o.meta+'</div>'+
    '<div class="pd">'+o.desc+'</div>'+
    (o.href ? '<a class="dlbtn" href="'+o.href+'" download>'+DL_ICON+t('下载','Download')+'</a>'
            : '<span class="meta">'+(o.note||'')+'</span>')+
    '</div>';
}

function render(){
  const total = SOURCES.reduce((a,s)=>a+s.count,0);
  $('lede').innerHTML = t(
    '同一份数据，按<em>三种维度</em>提供打包：以使用方式（最简单）、以来源（便于溯源与致谢）、以目录与索引（自建下游）。包内文件完全一致，只是分组不同。',
    'The same data, packaged along <em>three axes</em>: by usage tier (simplest), by source (for provenance and credit), and catalogue/indexes (for downstream builds). Contents are identical — only the grouping differs.'
  );

  /* 轴 1 */
  $('axis1Note').innerHTML = t(
    '如果你只想知道「我能不能商用」，用这一轴。C1 可商用、C2 非商用、C3 学习研究，另加完整 meta 包。',
    'If your only question is "may I use this commercially?", use this axis: C1 commercial, C2 non-commercial, C3 study/research, plus a full meta pack.'
  );
  const usage = [
    { id:'meta', nm:t('目录与索引','Catalogue &amp; indexes'), meta:'6 '+t('文件','files')+' · ~8 MB',
      desc:t('catalog.json（全库逐曲元数据）+ 三个索引（按作曲家 / 按时期 / 按乐器）+ 校验清单。任何下游构建都应先取此包。',
             'catalog.json (per-track metadata) + index-by-composer / period / instrument + manifest. Start here for any downstream build.') },
    { id:'main', nm:t('C1 · 可商用主包','C1 · Commercial main'), meta:'69,197 '+t('首','tracks')+' · ~216 MB',
      desc:t('许可允许商业使用的全部曲目（民歌、赞美诗、开放乐谱、游戏素材等）。商用须保留来源署名。',
             'All tracks whose licences permit commercial use. Attribution to sources required.') },
    { id:'piano-special', nm:t('C2 · 钢琴非商用包','C2 · Piano (non-commercial)'), meta:'34,869 '+t('首','tracks')+' · ~305 MB',
      desc:t('古典钢琴演奏录音转录（Aria-MIDI、MAESTRO），依 CC BY-NC-SA 4.0 提供，仅限非商业用途。',
             'Classical piano performance transcriptions (Aria-MIDI, MAESTRO) under CC BY-NC-SA 4.0 — non-commercial only.') },
    { id:'study', nm:t('C3 · 学习研究包','C3 · Study / research'), meta:'20,113 '+t('首','tracks')+' · ~59 MB',
      desc:t('中国民歌与部分传统音乐，仅供学习与研究；不得再分发、不得商用。',
             'Chinese folk songs and traditional material — study/research only; no redistribution, no commercial use.') },
  ];
  $('usagePacks').innerHTML = usage.map(u=>pkgCard({
    name:u.nm, meta:u.meta, desc:u.desc,
    href: REL + 'midicn-lib-' + VER + '-' + u.id + '.zip'
  })).join('');

  /* 轴 2 */
  const srcTotal = SOURCES.reduce((a,s)=>a+s.count,0);
  $('srcAxisMeta').textContent = t(SOURCES.length + ' 个来源 · ' + fmt(srcTotal) + ' 首',
                                   SOURCES.length + ' sources · ' + fmt(srcTotal) + ' tracks');
  $('axis2Note').innerHTML = t(
    '若你只需某一批素材、或希望在成果中精确致谢某个来源，用这一轴。每包只含单一来源的曲目，许可与 C1/C2/C3 档位标注在包名与包内 manifest 中。',
    'If you need one collection, or want to credit a specific source precisely, use this axis. Each pack holds a single source; its tier is noted in the pack name and manifest.'
  );
  $('srcPacks').innerHTML = SOURCES.map(s=>{
    const z = zoneOf(s.zone);
    return pkgCard({
      name: s.name[LANG],
      meta: z.code + ' ' + z[LANG] + ' · ' + fmt(s.count) + t(' 首',' tracks') + ' · ' + s.license,
      desc: s.kind[LANG] + '。' + (LANG==='zh' ? s.what.zh.slice(0, 68) + '…' : s.what.en.slice(0, 92) + '…'),
      href: REL + 'midicn-lib-' + VER + '-source-' + s.id + '.zip'
    });
  }).join('');

  /* 轴 3 */
  $('metaPacks').innerHTML = pkgCard({
    name: t('meta.zip · 目录与索引','meta.zip · catalogue &amp; indexes'),
    meta:'6 '+t('文件','files')+' · ~8 MB',
    desc: t('catalog.json 含全库逐曲字段：id / 标题 / 作曲家 / 分类 / 风格 / 时期 / 乐器 / 地域 / 国家 / 许可 / 时长 / 编号 / 曲式 / 年代 / 难度；另附按作曲家、时期、乐器的索引与校验清单。',
            'catalog.json carries every per-track field; plus indexes by composer, period and instrument, and a manifest.'),
    href: REL + 'midicn-lib-' + VER + '-meta.zip'
  });
  $('metaNote').innerHTML = t(
    '目录字段含义与覆盖率见 <a href="sources.html">数据来源</a>页；许可字段 <code>l</code> 的取值见 <a href="licenses.html">许可与法律</a>页。',
    'Field meanings and coverage: see <a href="sources.html">Sources</a>; licence values of the <code>l</code> field: see <a href="licenses.html">Licence &amp; legal</a>.'
  );

  /* 步骤 */
  const steps = LANG === 'zh' ? [
    '下载 <b>meta.zip</b>，用 catalog.json 决定你要哪些曲目。',
    '按使用方式或来源下载对应 zip（也可全部下载）。',
    '解压后目录为 <code>midicn-lib-' + VER + '/{pack}/{分类}/{id}.mid</code>，可直接被任何 MIDI 音序器或播放库读取。',
    '在成果中按 <a href="licenses.html">署名模板</a>标注本库与上游来源。'
  ] : [
    'Download <b>meta.zip</b> and use catalog.json to decide which tracks you need.',
    'Download the pack(s) you decided on — by usage tier or by source (or everything).',
    'Unpacked layout: <code>midicn-lib-' + VER + '/{pack}/{category}/{id}.mid</code>, readable by any MIDI sequencer or library.',
    'Credit this library and the upstream source using the <a href="licenses.html">attribution template</a>.'
  ];
  $('steps').innerHTML = steps.map(x=>'<li>'+x+'</li>').join('');

  /* 许可提示 */
  const z = ZONES; 
  $('licNote').innerHTML =
    '<div class="panel"><div class="panel-bd"><dl class="dl">'+
      '<dt>'+z.main.code+'</dt><dd>'+z.main[LANG]+' — '+(LANG==='zh'?z.main.zhDesc:z.main.enDesc)+'</dd>'+
      '<dt>'+z.piano.code+'</dt><dd>'+z.piano[LANG]+' — '+(LANG==='zh'?z.piano.zhDesc:z.piano.enDesc)+'</dd>'+
      '<dt>'+z.study.code+'</dt><dd>'+z.study[LANG]+' — '+(LANG==='zh'?z.study.zhDesc:z.study.enDesc)+'</dd>'+
    '</dl><p style="margin:var(--s4) 0 0">'+t(
      '逐曲许可与逐源条款见 <a href="licenses.html">许可与法律</a>；每个包内都附 manifest，写明所含来源、许可与校验值。',
      'Per-track and per-source terms: <a href="licenses.html">Licence &amp; legal</a>. Every pack ships a manifest listing sources, licences and checksums.'
    )+'</p></div></div>';
  $('footNote').innerHTML = t('版本 '+VER+' · 全部资产见 <a href="'+PAGE+'" target="_blank" rel="noopener">Release 页面</a>',
                              'Version '+VER+' · all assets on the <a href="'+PAGE+'" target="_blank" rel="noopener">release page</a>');
  $('footLegal').innerHTML = t('下载即表示你已阅读并同意<a href="licenses.html">许可条款</a>。',
                               'By downloading you accept the <a href="licenses.html">licence terms</a>.');
}
applyLang();
</script>
