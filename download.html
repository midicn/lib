<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const LIC_TEXT = { zh:'代码 MIT · 元数据 CC BY 4.0 · 素材依各来源许可',
                  en:'Code MIT · metadata CC BY 4.0 · material per source' };
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

let LANG = store.get('midicn-lang', null) || 'zh';
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const $ = id => document.getElementById(id);

const VER = 'v1.23';
const REL = 'https://github.com/midicn/midi-library/releases/download/' + VER + '/';
const PAGE = 'https://github.com/midicn/midi-library/releases/tag/' + VER;

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh';
  store.set('midicn-lang', LANG); applyLang(); };
const themeBtn = $('theme');
function setTheme(v){ document.documentElement.dataset.theme = v; store.set('midicn-theme', v); }
setTheme(store.get('midicn-theme', null) || 'dark');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

const DL_ICON = '<svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>';

function pkgCard(o){
  return '<div class="pkg">'+
    '<div class="pn">'+o.name+'</div>'+
    '<div class="pm">'+o.meta+'</div>'+
    '<div class="pd">'+o.desc+'</div>'+
    (o.href ? '<a class="dlbtn" href="'+o.href+'" download>'+DL_ICON+t('下载','Download')+'</a>'
            : '<span class="meta">'+(o.note||'')+'</span>')+
    '</div>';
}

function render(){
  const total = SOURCES.reduce((a,s)=>a+s.count,0);
  const ZIP = 'https://zip.midicn.com/';

  $('lede').innerHTML = t(
    '同一份数据，按<em>两条路径</em>取用：<b>用途包</b>（整库 4 个，按能否商用分档）与<b>维度包</b>（按来源 / 风格 / 时期 / 乐器 / 授权 / 曲式 / 地域 / 作曲家 切成 400+ 个子集）。包内文件完全一致，只是分组不同。',
    'The same data, along <em>two paths</em>: <b>usage packs</b> (4 packs split by commercial use) and <b>dimension packs</b> (400+ subsets by source / genre / period / instrument / licence / form / region / composer). Contents are identical — only the grouping differs.'
  );

  $('hubNote').innerHTML = t(
    '<b>下载入口</b>：全部包（4 个用途包 + 400+ 个维度包）的下载入口统一在 '+
    '<a href="'+ZIP+'" target="_blank" rel="noopener"><b>zip.midicn.com</b></a>。'+
    '本页只做总览与说明，便于你先判断该取哪一个包。'+
    '<br><br><a class="dlbtn" href="'+ZIP+'" target="_blank" rel="noopener">'+DL_ICON+'前往下载站 zip.midicn.com</a>',
    '<b>Where to download</b>: every pack (4 usage packs + 400+ dimension packs) is served from '+
    '<a href="'+ZIP+'" target="_blank" rel="noopener"><b>zip.midicn.com</b></a>. '+
    'This page is an overview only, to help you decide which pack you need.'+
    '<br><br><a class="dlbtn" href="'+ZIP+'" target="_blank" rel="noopener">'+DL_ICON+'Go to zip.midicn.com</a>'
  );

  /* 轴 1：用途包 */
  $('axis1Note').innerHTML = t(
    '如果你只想知道「我能不能商用」，用这一轴。C1 可商用、C2 非商用、C3 学习研究，另加完整 meta 包。整库 '+fmt(total)+' 首。',
    'If your only question is "may I use this commercially?", use this path: C1 commercial, C2 non-commercial, C3 study/research, plus a full meta pack. '+fmt(total)+' tracks in total.'
  );
  const usage = [
    { id:'meta', nm:t('目录与索引','Catalogue &amp; indexes'), meta:'6 '+t('文件','files')+' · ~8 MB',
      desc:t('catalog.json（全库逐曲元数据，v1.23 起含作品归组键 wk、演奏者、作曲家中文名等）+ 三个索引（按作曲家 / 按时期 / 按乐器）+ 校验清单。任何下游构建都应先取此包。',
             'catalog.json (per-track metadata; v1.23 adds work key wk, performer, Chinese composer names) + indexes by composer / period / instrument + manifest. Start here for any downstream build.') },
    { id:'main', nm:t('C1 · 可商用主包','C1 · Commercial main'), meta:'79,216 '+t('首','tracks'),
      desc:t('许可允许商业使用的全部曲目（古典、民歌、赞美诗、爱尔兰传统、开放乐谱、游戏素材等）。商用须保留来源署名。',
             'All tracks whose licences permit commercial use (classical, folk, hymns, Irish traditional, open scores, game assets). Attribution required.') },
    { id:'piano-special', nm:t('C2 · 钢琴非商用包','C2 · Piano (non-commercial)'), meta:'34,869 '+t('首','tracks'),
      desc:t('古典钢琴演奏录音转录（Aria-MIDI、MAESTRO、EMOPIA），依 CC BY-NC-SA 4.0 提供，仅限非商业用途。',
             'Classical piano performance transcriptions (Aria-MIDI, MAESTRO, EMOPIA) under CC BY-NC-SA 4.0 — non-commercial only.') },
    { id:'study', nm:t('C3 · 学习研究包','C3 · Study / research'), meta:'19,582 '+t('首','tracks'),
      desc:t('中国民间歌曲集成与 Lakh 过滤子集，仅供学习与研究；不得再分发、不得商用。',
             'Chinese folk-song anthology and the filtered Lakh subset — study/research only; no redistribution, no commercial use.') },
  ];
  $('usagePacks').innerHTML = usage.map(u=>pkgCard({
    name:u.nm, meta:u.meta, desc:u.desc, href: ZIP
  })).join('');

  /* 轴 2：维度包（跳转 zip 站） */
  $('srcAxisMeta').textContent = t('8 个维度 · 400+ 个包 · 约 4.6 GB',
                                   '8 dimensions · 400+ packs · ~4.6 GB');
  $('axis2Note').innerHTML = t(
    '若你只需某一批素材（例如「巴洛克长笛」或「爱尔兰民谣」），或希望在成果中精确致谢某个来源，用这一轴。维度包按 <b>来源 · 风格 · 时期 · 乐器 · 授权档位 · 曲式 · 地域 · 作曲家</b> 切成 400+ 个子集，每包含子集 MIDI + 子集 catalog + 许可说明，可独立分发。',
    'For one collection (say "Baroque flute" or "Irish folk"), or to credit a specific source precisely, use this path. Dimension packs split the library into 400+ subsets by <b>source · genre · period · instrument · licence tier · form · region · composer</b>; each ships its own MIDI files, subset catalogue and licence notice, and can be redistributed independently.'
  );
  $('srcPacks').innerHTML = pkgCard({
    name: t('维度包总览（400+ 个）','Dimension packs (400+)'),
    meta: t('8 个维度 · 逐个可下载 · zip.midicn.com','8 dimensions · individually downloadable · zip.midicn.com'),
    desc: t('按维度折叠浏览，每包一行显示曲目数与体积；点包名即下载。',
            'Browse by dimension, one row per pack with track count and size; click a pack name to download.'),
    href: ZIP
  });

  /* 步骤 */
  const steps = LANG === 'zh' ? [
    '不确定要哪个？先下载 <b>meta.zip</b>，用 catalog.json 查看全库逐曲字段。',
    '要整库 → 在 <a href="'+ZIP+'" target="_blank" rel="noopener">zip 站</a>取 <b>4 个用途包</b>；只要一批 → 取对应的<b>维度包</b>。',
    '解压后目录为 <code>midicn-lib-' + VER + '/{分类}/{id}.mid</code>，可直接被任何 MIDI 音序器或播放库读取。',
    '在成果中按 <a href="licenses.html">署名模板</a>标注本库与上游来源。'
  ] : [
    'Not sure which pack? Download <b>meta.zip</b> first and inspect catalog.json.',
    'Whole library → take the <b>4 usage packs</b> on the <a href="'+ZIP+'" target="_blank" rel="noopener">zip site</a>; one collection → take the matching <b>dimension pack</b>.',
    'Unpacked layout: <code>midicn-lib-' + VER + '/{pack}/{category}/{id}.mid</code>, readable by any MIDI sequencer or library.',
    'Credit this library and the upstream source using the <a href="licenses.html">attribution template</a>.'
  ];
  $('steps').innerHTML = steps.map(x=>'<li>'+x+'</li>').join('');

  /* 许可提示 */
  const z = ZONES;
  $('licNote').innerHTML =
    '<div class="panel"><div class="panel-bd"><dl class="dl">'+
      '<dt>'+z.main.code+'</dt><dd>'+z.main[LANG]+' — '+(LANG==='zh'?z.main.zhDesc:z.main.enDesc)+'</dd>'+
      '<dt>'+z.piano.code+'</dt><dd>'+z.piano[LANG]+' — '+(LANG==='zh'?z.piano.zhDesc:z.piano.enDesc)+'</dd>'+
      '<dt>'+z.study.code+'</dt><dd>'+z.study[LANG]+' — '+(LANG==='zh'?z.study.zhDesc:z.study.enDesc)+'</dd>'+
    '</dl><p style="margin:var(--s4) 0 0">'+t(
      '逐曲许可与逐源条款见 <a href="licenses.html">许可与法律</a>；每个包内都附清单，写明所含来源、许可与校验值。',
      'Per-track and per-source terms: <a href="licenses.html">Licence &amp; legal</a>. Every pack ships a manifest listing sources, licences and checksums.'
    )+'</p></div></div>';
  $('lyricsNote').innerHTML = t(
    '本库另有 <b>10,035 首中国民歌歌词</b>（来源：中国民间歌曲集成 OMR 数据集）。'+
    '歌词是<b>独立于曲目的另一层权利对象</b>——上游对 MIDI 文件的许可<b>不能自动延伸</b>到其中可能由第三方写入的歌词，'+
    '因此<b>歌词库不进任何发布包、本页也不提供下载</b>，仅可在 <a href="lyrics.html">歌词检索</a>页查阅，且'+
    '<b>仅限研究、教学与学习用途</b>。另有 2,642 首来自公有领域来源的曲目内含 MIDI 歌词事件（歌词本身即 PD），随曲目分发，同样适用该定性。',
    'This library also holds <b>10,035 Chinese folk-song lyrics</b> (source: Anthology of Chinese Folk Songs, OMR). '+
    'Lyrics are a <b>separate rights object from the track</b> — an upstream licence over the MIDI file <b>does not automatically '+
    'extend</b> to lyric text a third party may have written into it. The lyrics library therefore <b>ships in no pack and is not '+
    'downloadable here</b>; it can only be consulted on the <a href="lyrics.html">lyrics search</a> page, and <b>for study, teaching '+
    'and learning only</b>. A further 2,642 tracks from public-domain sources carry MIDI lyric events whose text is itself public '+
    'domain; they ship with the tracks under the same restriction.'
  );

  $('footNote').innerHTML = t('版本 '+VER+' · 全部资产见 <a href="'+PAGE+'" target="_blank" rel="noopener">Release 页面</a>',
                              'Version '+VER+' · all assets on the <a href="'+PAGE+'" target="_blank" rel="noopener">release page</a>');
  $('footLic') && ($('footLic').innerHTML = t(LIC_TEXT.zh, LIC_TEXT.en));
  $('footLegal').innerHTML = t('下载即表示你已阅读并同意<a href="licenses.html">许可条款</a>。',
                               'By downloading you accept the <a href="licenses.html">licence terms</a>.');
}
applyLang();
</script>
