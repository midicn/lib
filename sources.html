<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数据来源 · midicn-lib</title>
<meta name="description" content="midicn-lib 收录的开放 MIDI 来源：逐源说明、原始地址、许可条款与致谢。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B0B0C'/%3E%3Crect x='14' y='30' width='4' height='14' fill='%23CE4A32'/%3E%3Crect x='24' y='20' width='4' height='24' fill='%23CE4A32'/%3E%3Crect x='34' y='26' width='4' height='18' fill='%23C9A227'/%3E%3Crect x='44' y='16' width='4' height='28' fill='%23C9A227'/%3E%3C/svg%3E">
</head>
<body>

<header><div class="hbar">
  <a class="brand" href="./"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#0B0B0C"/><rect x="14" y="30" width="4" height="14" fill="#CE4A32"/><rect x="24" y="20" width="4" height="24" fill="#CE4A32"/><rect x="34" y="26" width="4" height="18" fill="#C9A227"/><rect x="44" y="16" width="4" height="28" fill="#C9A227"/></svg><b>midicn-lib</b><i>archive</i></a>
  <nav class="nav">
    <a href="./" data-zh="音乐库" data-en="Library">音乐库</a>
    <a href="download.html" data-zh="数据下载" data-en="Download">数据下载</a>
    <a href="sources.html" class="on" data-zh="数据来源" data-en="Sources">数据来源</a>
    <a href="licenses.html" data-zh="许可与法律" data-en="Licence">许可与法律</a>
  </nav>
  <button class="iconbtn" id="theme" title="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 3z"/></svg></button>
  <button class="iconbtn langbtn" id="lang">EN</button>
</div></header>

<main class="doc wide">
  <p class="meta" data-zh="档案 · 来源志" data-en="ARCHIVE · PROVENANCE">档案 · 来源志</p>
  <h1 data-zh="数据来源" data-en="Sources">数据来源</h1>
  <p class="lede" id="lede"></p>
  <div class="stitle">
    <h2 data-zh="已收录来源" data-en="Included sources">已收录来源</h2>
    <span class="spacer"></span><span class="meta" id="srcCount"></span>
  </div>
  <style>
    #list{display:grid;gap:var(--s5);grid-template-columns:1fr;align-items:start}
    @media(min-width:1180px){ #list{grid-template-columns:1fr 1fr} }
  </style>
  <div id="list"></div>
  <div class="stitle"><h2 data-zh="考察后未收录" data-en="Examined, not included">考察后未收录</h2></div>
  <style>@media(min-width:1180px){ #excluded{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)} #excluded > .panel{margin-bottom:0!important} }</style>
  <div id="excluded"></div>

  <div class="stitle"><h2 data-zh="上游数据如何进入本库" data-en="How upstream data enters this library">上游数据如何进入本库</h2></div>
  <ol class="steps" id="pipeline"></ol>

  <div class="note" id="caveat"></div>
</main>

<footer><div class="wrap">
  <div class="fbar">
    <b>midicn-lib</b>
    <nav class="fnav">
      <a href="./" data-zh="音乐库" data-en="Library">音乐库</a>
      <a href="download.html" data-zh="数据下载" data-en="Download">数据下载</a>
      <a href="sources.html" data-zh="数据来源" data-en="Sources">数据来源</a>
      <a href="licenses.html" data-zh="许可与法律" data-en="Licence">许可与法律</a>
      <a href="https://github.com/midicn/midi-lib" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <span class="flic" id="footLic"></span>
  </div>
  <div class="fnote"><span id="footNote"></span><span id="footLegal"></span></div>
</div></footer>

<script src="assets/archive.js"></script>
<script>
/* 安全存储：file:// 或隐私模式下 localStorage 会抛 SecurityError */
const LIC_TEXT = { zh:'代码 MIT · 元数据 CC BY 4.0 · 素材依各来源许可',
                  en:'Code MIT · metadata CC BY 4.0 · material per source' };
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

let LANG = store.get('midicn-lang', null) || 'zh';
function t(zh, en){ return LANG === 'zh' ? zh : en; }
const $ = id => document.getElementById(id);

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{
    const v = el.getAttribute('data-' + LANG); if (v != null) el.innerHTML = v;
  });
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中';
  render();
}
$('lang').onclick = ()=>{ LANG = LANG === 'zh' ? 'en' : 'zh';
  store.set('midicn-lang', LANG); applyLang(); };

const themeBtn = $('theme');
function setTheme(v){ document.documentElement.dataset.theme = v; store.set('midicn-theme', v); }
setTheme(store.get('midicn-theme', null) || 'dark');
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

function srcCard(s){
  const z = zoneOf(s.zone);
  return '<div class="panel">'+
    '<div class="panel-hd">'+
      '<span style="flex:none;width:104px">'+sigHTML(s.id + s.count, 22)+'</span>'+
      '<b style="font-size:var(--fs-16)">'+s.name[LANG]+'</b>'+
      '<span class="lic '+z.cls+'">'+z.code+' '+z[LANG]+'</span>'+
      '<span style="margin-left:auto"></span>'+
      '<span class="meta">'+fmt(s.count)+t(' 首',' tracks')+'</span>'+
    '</div>'+
    '<div class="panel-bd">'+
      '<p class="meta" style="margin-bottom:var(--s3)">'+s.kind[LANG]+'</p>'+
      '<p style="margin-bottom:var(--s4)">'+s.what[LANG]+'</p>'+
      '<dl class="dl">'+
        '<dt>'+t('上游形态','UPSTREAM')+'</dt><dd>'+s.method[LANG]+'</dd>'+
        '<dt>'+t('许可','LICENCE')+'</dt><dd>'+s.license+(s.count_note?(' · '+s.count_note):'')+'</dd>'+
        '<dt>'+t('原始地址','HOME')+'</dt><dd><a href="'+s.url+'" target="_blank" rel="noopener">'+s.url+'</a></dd>'+
        '<dt>'+t('致谢','CREDIT')+'</dt><dd>'+s.credit[LANG]+'</dd>'+
      '</dl>'+
    '</div></div>';
}

function render(){
  const total = SOURCES.reduce((a,s)=>a+s.count,0);
  $('lede').innerHTML = t(
    '本库每一首 MIDI 都来自公开、可核查的上游来源。本页逐源说明：<em>它是什么</em>、<em>我们从何处取得</em>、<em>依据什么条款使用</em>，并给出原始地址以便回溯与致谢。',
    'Every MIDI here comes from a public, verifiable upstream. For each source: <em>what it is</em>, <em>where we got it</em>, <em>under which terms we use it</em> — with a link back to the original.'
  );
  $('srcCount').textContent = t(SOURCES.length+' 个来源 · 合计 '+fmt(total)+' 首',
                                SOURCES.length+' sources · '+fmt(total)+' tracks');
  $('list').innerHTML = SOURCES.map(srcCard).join('');

  $('excluded').innerHTML = EXCLUDED.map(s=>(
    '<div class="panel" style="margin-bottom:var(--s4)">'+
    '<div class="panel-hd"><b style="font-size:var(--fs-16)">'+s.name[LANG]+'</b>'+
      '<span class="lic no">'+t('不可分发','NOT REDISTRIBUTABLE')+'</span>'+
      '<span style="margin-left:auto"></span>'+
      '<span class="meta">'+fmt(s.count)+t(' 首（未收录）',' tracks (excluded)')+'</span></div>'+
    '<div class="panel-bd"><p style="margin-bottom:var(--s3)">'+s.why[LANG]+'</p>'+
    '<dl class="dl"><dt>'+t('许可','LICENCE')+'</dt><dd>'+s.license+'</dd>'+
    '<dt>'+t('原始地址','HOME')+'</dt><dd><a href="'+s.url+'" target="_blank" rel="noopener">'+s.url+'</a></dd></dl>'+
    '</div></div>'
  )).join('');

  const steps = LANG === 'zh' ? [
    '<b>上游发布</b>：上游项目以其公开渠道发布原始文件与元数据表（MIDI / ABC / LilyPond / MusicXML / CSV）。',
    '<b>格式转换</b>：格式统一为标准 MIDI，保留速度、拍号与配器；重算时长并校验可播放性。',
    '<b>去重</b>：以文件 MD5 与「来源 + 标题 + 时长」双重指纹剔除重复条目。',
    '<b>元数据补全</b>：以 IMSLP 官方作品目录、作曲家生卒表与上游头字段，交叉补全标题、编号、时期、乐器、地域。',
    '<b>许可标注</b>：逐曲记录许可，归入 C1 可商用 / C2 非商用 / C3 学习研究 三档。',
    '<b>发布</b>：生成目录与分片，打包为 Release 资产，保留可复现的构建脚本。'
  ] : [
    '<b>Upstream release</b>: each upstream project publishes its files and metadata tables through its own public channel.',
    '<b>Format conversion</b>: normalise to standard MIDI, preserve tempo, meter, instrumentation; recompute duration and verify playability.',
    '<b>De-duplication</b>: drop duplicates via MD5 plus a content fingerprint (source + title + duration).',
    '<b>Metadata completion</b>: cross-fill title, catalogue number, period, instrument and region from IMSLP, composer date tables and upstream headers.',
    '<b>Licence labelling</b>: record per-track licence into C1 commercial / C2 non-commercial / C3 study tiers.',
    '<b>Packaging</b>: emit catalogue and shards, package Release assets, keep the build reproducible.'
  ];
  $('pipeline').innerHTML = steps.map(x=>'<li>'+x+'</li>').join('');

  $('caveat').innerHTML = t(
    '若你是某来源的整理者或权利人，希望调整收录方式、补充署名或要求移除，请通过开源项目 issue 联系我们，我们会优先处理。',
    'If you are a compiler or rights holder of any source and wish to adjust attribution or request removal, please open an issue on the open-source project — we will prioritise it.'
  );
  $('footNote').innerHTML = t(
    '本库是<strong>整理与转译</strong>项目：原始素材的权利属于各来源方，我们只做格式统一、元数据补全与许可标注。',
    'This library is a <strong>curation and conversion</strong> project; rights in the source material belong to the respective sources.'
  );
  $('footLic') && ($('footLic').innerHTML = t(LIC_TEXT.zh, LIC_TEXT.en));
  $('footLegal').innerHTML = t(
    '署名与商用指引见 <a href="licenses.html">许可与法律</a> · 数据版本 v1.19',
    'Attribution &amp; commercial guidance: <a href="licenses.html">Licence &amp; legal</a> · data v1.19'
  );
}
applyLang();
</script>
</body>
</html>
